name: Claude — mode interactif

# ─────────────────────────────────────────────────────────────────────────────
# RÉPONDRE À `@claude` DANS UN TICKET OU UNE PROPOSITION
#
# C'est par ici qu'une tâche se confie SANS ouvrir de session : on écrit
# `@claude …` dans un ticket, dans un commentaire de ticket, dans un
# commentaire de proposition ou dans une revue, et le travail part.
#
# MODE INTERACTIF = AUCUNE ENTRÉE `prompt`. L'action déduit son mode de la
# présence de `prompt` : sans elle, elle attend la phrase déclenchante et
# répond dans un commentaire du ticket ou de la proposition. Ajouter un
# `prompt` ici la ferait basculer en mode automatique, et elle partirait sur
# CHAQUE commentaire.
#
# QUI PEUT DÉCLENCHER : le flux exige `author_association == 'OWNER'`, et
# l'action revérifie de son côté qu'un compte sans accès en écriture ne peut
# rien déclencher, robots compris. **Le filtre du dépôt est venu le
# 12/09/2026, et pour DEUX raisons distinctes qu'il faut lire séparément.**
#
#   1. SÉCURITÉ. « L'action refuse d'elle-même » est une garantie qui vit
#      entièrement CHEZ LE FOURNISSEUR : elle est juste aujourd'hui, et rien
#      dans ce dépôt ne la constate. Un exécuteur démarré est un exécuteur qui
#      lit nos secrets — `CLAUDE_CODE_OAUTH_TOKEN` est monté avant que
#      l'action n'ait jugé quoi que ce soit. *Le refus doit donc arriver AVANT
#      la machine*, et c'est ce que ce `if` fait.
#
#   2. ÉCONOMIE, ET ELLE EST MESURÉE À ZÉRO. *Sur les 77 exécutions du mois de
#      septembre 2026 : 70 n'ont facturé AUCUNE minute* — le `if` ci-dessous
#      les écartait déjà, un job « skipped » ne démarre pas d'exécuteur — et
#      les 7 restantes étaient de vraies invocations `@claude`, que ce filtre
#      ne retire pas. **Ce changement ne fait donc économiser rien du tout**,
#      et l'écrire vaut mieux que de le laisser passer pour une économie.
#
# `author_association` se lit sur un objet DIFFÉRENT selon l'événement — le
# ticket, le commentaire, la revue —, et il n'existe pas d'expression commune :
# les quatre branches le nomment chacune.
#
# `github_token` N'EST PAS PASSÉ, ET C'EST UNE DÉCISION : sans lui, l'action
# s'authentifie comme l'application GitHub Claude, si bien que les commits
# qu'elle pousse DÉCLENCHENT la CI. Avec le `GITHUB_TOKEN` par défaut, GitHub
# n'enchaîne aucun flux sur les commits produits — les propositions
# arriveraient sans vérification, ce qui est exactement le contraire de ce
# qu'on veut.
# ─────────────────────────────────────────────────────────────────────────────

on:
  issues:
    # `opened` seulement : `assigned` déclencherait sur une assignation dont le
    # corps ne contient rien de neuf, et le filtre ci-dessous l'écarterait de
    # toute façon — un déclencheur qui n'aboutit jamais est une promesse fausse.
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

# Deux mentions dans le même fil ne se marchent pas dessus. On n'annule PAS
# celle en cours : une session coupée au milieu laisse une branche à moitié
# écrite, ce qui coûte plus cher que d'attendre.
concurrency:
  group: claude-interactif-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    name: "@claude"
    # Le filtre évite de démarrer un exécuteur sur les commentaires ordinaires,
    # ET il borne QUI peut en démarrer un : `OWNER` seul. L'action revérifie la
    # phrase déclenchante et les droits de son côté — mais sa vérification a
    # lieu APRÈS le démarrage de l'exécuteur, donc après le montage des
    # secrets. *Ce `if` est la seule moitié de la garantie que ce dépôt tienne
    # lui-même.*
    #
    # ⚠ `OWNER` est étroit PAR DÉCISION : un collaborateur — `COLLABORATOR`,
    # `MEMBER` — ne déclenche plus. Le jour où quelqu'un d'autre doit pouvoir
    # écrire `@claude`, c'est cette ligne qu'on élargit, et ce sera une
    # décision. *Un filtre qu'on élargit « pour que ça marche » sans dire pour
    # qui redevient une absence de filtre.*
    if: |
      (github.event_name == 'issues' && github.event.issue.author_association == 'OWNER' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))) ||
      (github.event_name == 'issue_comment' && github.event.comment.author_association == 'OWNER' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && github.event.comment.author_association == 'OWNER' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && github.event.review.author_association == 'OWNER' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    # Une tâche interactive qui s'emballe coûte de l'argent réel.
    timeout-minutes: 60
    permissions:
      contents: write # écrire des fichiers et pousser une branche
      pull-requests: write # ouvrir une proposition, y commenter
      issues: write # répondre dans le ticket
      id-token: write # exigé par l'authentification par application GitHub
      actions: read # lire les résultats de CI d'une proposition
    steps:
      - uses: actions/checkout@v5
        with:
          # L'historique complet : une session qui rebase ou qui lit une
          # empreinte sur `main` ne peut rien faire d'un dépôt tronqué.
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        env:
          # Même raison que dans nuit.yml : `github_token` n'est PAS passé à
          # l'action, pour qu'elle s'authentifie comme l'application GitHub et
          # que ses poussées déclenchent la CI. `GH_TOKEN` ne sert qu'à `gh`.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 60
            --allowedTools "Bash,Read,Write,Edit,MultiEdit,Glob,Grep,TodoWrite,WebFetch,WebSearch"
