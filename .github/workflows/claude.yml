name: Claude — mode interactif

# ─────────────────────────────────────────────────────────────────────────────
# RÉPONDRE À `@claude` DANS UN TICKET OU UNE PROPOSITION
#
# C'est par ici qu'une tâche se confie SANS ouvrir de session : on écrit
# `@claude …` dans un ticket, dans un commentaire de ticket, dans un
# commentaire de proposition ou dans une revue, et le travail part.
#
# MODE INTERACTIF = AUCUNE ENTRÉE `prompt`. L'action déduit son mode de la
# présence de `prompt` : sans elle, elle attend la phrase déclenchante et
# répond dans un commentaire du ticket ou de la proposition. Ajouter un
# `prompt` ici la ferait basculer en mode automatique, et elle partirait sur
# CHAQUE commentaire.
#
# QUI PEUT DÉCLENCHER : l'action refuse d'elle-même un compte sans accès en
# écriture, et refuse un compte robot — c'est ce qui l'empêche de se répondre
# à elle-même en boucle.
#
# `github_token` N'EST PAS PASSÉ, ET C'EST UNE DÉCISION : sans lui, l'action
# s'authentifie comme l'application GitHub Claude, si bien que les commits
# qu'elle pousse DÉCLENCHENT la CI. Avec le `GITHUB_TOKEN` par défaut, GitHub
# n'enchaîne aucun flux sur les commits produits — les propositions
# arriveraient sans vérification, ce qui est exactement le contraire de ce
# qu'on veut.
# ─────────────────────────────────────────────────────────────────────────────

on:
  issues:
    types: [opened, assigned]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

# Deux mentions dans le même fil ne se marchent pas dessus. On n'annule PAS
# celle en cours : une session coupée au milieu laisse une branche à moitié
# écrite, ce qui coûte plus cher que d'attendre.
concurrency:
  group: claude-interactif-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    name: "@claude"
    # Le filtre évite de démarrer un exécuteur sur les commentaires ordinaires.
    # L'action revérifie la phrase déclenchante de son côté : ce `if` est une
    # économie, jamais la garantie.
    if: |
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    # Une tâche interactive qui s'emballe coûte de l'argent réel.
    timeout-minutes: 60
    permissions:
      contents: write # écrire des fichiers et pousser une branche
      pull-requests: write # ouvrir une proposition, y commenter
      issues: write # répondre dans le ticket
      id-token: write # exigé par l'authentification par application GitHub
      actions: read # lire les résultats de CI d'une proposition
    steps:
      - uses: actions/checkout@v5
        with:
          # L'historique complet : une session qui rebase ou qui lit une
          # empreinte sur `main` ne peut rien faire d'un dépôt tronqué.
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          # Le secret posé dans ce dépôt est un JETON D'ABONNEMENT, pas une
          # clé d'API : c'est donc `claude_code_oauth_token` et jamais
          # `anthropic_api_key`.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 60
