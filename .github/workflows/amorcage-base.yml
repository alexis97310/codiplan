name: Amorcer une base (référentiels et première société)

# LES DEUX GESTES QUI PRÉCÈDENT L'OUVERTURE DU PREMIER COMPTE.
#
# Découverts en mesurant la chaîne de mise en ligne le 09/09/2026, sur une base
# neuve migrée SANS seed :
#   — `devise` était vide, donc aucune société ne pouvait être créée ;
#   — aucune société n'existait, donc `--societe <uuid>` n'avait rien à nommer.
# La procédure était impossible à suivre jusqu'au bout, et personne ne s'en
# était aperçu parce que la seule base existante portait déjà les deux.
#
# Chaque geste est SÉPARÉ et se coche : un geste de référentiel et un geste
# d'identité ne partagent ni leurs défaillances, ni leurs cliquets — c'est la
# raison qui a séparé le taux horaire de l'amorçage (décision du 09/09).
#
# DEUX GESTES DE PLUS DEPUIS LE 22/09/2026 (AMORCAGE-2), chacun sous sa case :
# le PREMIER TAUX HORAIRE et l'HORIZON DES JOURS FÉRIÉS. Leurs scripts
# existaient et n'avaient aucun flux — un `grep` sur ce répertoire ne rendait
# rien —, donc exigeaient un terminal branché sur la base de production. Un
# acheteur de CODIPLAN n'en aura pas. Un gardien exige désormais que toute
# case déclarée ici ait son étape (tests/unit/ci/gestes-amorcage.test.ts).
#
# IMPÉRATIF, comme partout ici : aucun déclenchement automatique.
on:
  workflow_dispatch:
    inputs:
      cible:
        description: "Quelle base ?"
        type: choice
        required: true
        default: production
        options:
          - production
          - demonstration
      confirmation:
        description: "Taper « oui » pour confirmer"
        type: string
        required: true
        default: "non"
      poser_referentiels:
        description: "Poser les devises et parités (sans objet si elles y sont déjà)"
        type: boolean
        required: false
        default: true
      creer_societe:
        description: "Ouvrir une société — décocher si elle existe déjà"
        type: boolean
        required: false
        default: false
      code:
        description: "Code de la société (préfixe de numérotation, ex. CODIMA-NC)"
        type: string
        required: false
        default: ""
      raison_sociale:
        description: "Raison sociale"
        type: string
        required: false
        default: ""
      pays:
        description: "Pays, ISO 3166-1 alpha-2 (ex. NC)"
        type: string
        required: false
        default: ""
      territoire:
        description: "Territoire des jours fériés, ISO 3166-1 alpha-2 — JAMAIS déduit du fuseau (D46)"
        type: string
        required: false
        default: ""
      fuseau:
        description: "Fuseau IANA (ex. Pacific/Noumea)"
        type: string
        required: false
        default: ""
      devise:
        description: "Devise, ISO 4217 (ex. XPF)"
        type: string
        required: false
        default: ""
      langue:
        description: "Langue, deux lettres (ex. fr) — documente une intention, non exploitée en V1 (D26)"
        type: string
        required: false
        default: ""
      majoration:
        description: "Majoration hors ouverture, en POURCENTAGE — aucune valeur par défaut : c'est un prix"
        type: string
        required: false
        default: ""
      # ── DEUX GESTES DE PLUS, AJOUTÉS LE 22/09/2026 (AMORCAGE-2) ──────────
      # Ils existaient en scripts et n'avaient AUCUN flux : un terminal branché
      # sur la base de production était exigé, et un acheteur de CODIPLAN n'en
      # aura pas. Chacun sous sa propre case, dans la forme des deux premiers.
      poser_taux:
        description: "Poser le PREMIER taux horaire d'une société — exige « societe » et « montant »"
        type: boolean
        required: false
        default: false
      societe:
        description: "Identifiant (UUID) de la société, rendu par le geste d'ouverture — pour le taux"
        type: string
        required: false
        default: ""
      montant:
        description: "Taux horaire HT, ENTIER dans l'unité la plus fine de la devise de la société (7000 = 7 000 XPF, 6500 = 65,00 EUR) — aucune valeur par défaut : c'est un prix"
        type: string
        required: false
        default: ""
      date_effet:
        description: "Date d'effet du taux, AAAA-MM-JJ — vide : le jour du geste, dans le fuseau de la société"
        type: string
        required: false
        default: ""
      etendre_feries:
        description: "Étendre l'horizon des jours fériés, par TERRITOIRE depuis les agences (D46) — exige qu'une agence existe"
        type: boolean
        required: false
        default: false

concurrency:
  group: amorcage-base
  cancel-in-progress: false

jobs:
  amorcer:
    name: amorcer la base
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Bruts : c'est l'étape de choix qui tranche. Une expression
      # `cible == 'production' && secrets.PRODUCTION_… || secrets.…` retombe
      # SILENCIEUSEMENT sur la démonstration quand le secret de production est
      # vide — mesuré en écrivant ce flux, et attrapé par le gardien de
      # l'inventaire, qui refuse tout repli entre les deux secrets.
      SECRET_MIGRATION_DEMONSTRATION: ${{ secrets.MIGRATION_DATABASE_URL }}
      SECRET_MIGRATION_PRODUCTION: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}
    steps:
      - name: Refuser sans confirmation explicite
        if: ${{ inputs.confirmation != 'oui' }}
        run: |
          echo "::error::Le champ « confirmation » doit valoir exactement « oui »."
          exit 1

      - name: Choisir la base, et refuser plutôt que se rabattre
        env:
          CIBLE: ${{ inputs.cible }}
        run: |
          set -euo pipefail
          if [ "$CIBLE" = "production" ]; then
            migration="$SECRET_MIGRATION_PRODUCTION"
            prefixe="PRODUCTION_"
          else
            migration="$SECRET_MIGRATION_DEMONSTRATION"
            prefixe=""
          fi
          if [ -z "$migration" ]; then
            echo "::error::Le secret ${prefixe}MIGRATION_DATABASE_URL n'existe pas. Aucun repli n'est prévu : déposez-le, ou changez de cible."
            exit 1
          fi
          echo "DATABASE_URL=$migration" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Poser les référentiels de plateforme
        if: ${{ inputs.poser_referentiels }}
        env:
          REFERENTIELS_PLATEFORME_CONFIRMES: "oui"
        run: pnpm exec tsx scripts/referentiels-plateforme.mts

      # Le script porte son cliquet : il refuse si une société porte déjà ce
      # code, et il n'invente AUCUNE des sept valeurs — la majoration est un
      # pourcentage, lui donner un défaut déciderait d'un prix (CLAUDE.md §8).
      - name: Ouvrir la première société
        if: ${{ inputs.creer_societe }}
        env:
          SOCIETE_INITIALE_CONFIRMEE: "oui"
          CODE: ${{ inputs.code }}
          RAISON: ${{ inputs.raison_sociale }}
          PAYS: ${{ inputs.pays }}
          TERRITOIRE: ${{ inputs.territoire }}
          FUSEAU: ${{ inputs.fuseau }}
          DEVISE: ${{ inputs.devise }}
          LANGUE: ${{ inputs.langue }}
          MAJORATION: ${{ inputs.majoration }}
        run: |
          set -uo pipefail
          # MÊME FORME QUE « Ouvrir le PREMIER compte », MOINDRE PORTÉE
          # (12/09/2026). Ce que ce geste imprime volontairement n'est pas un
          # secret — un UUID de ligne, qui se relit en base. Ce qu'il peut
          # imprimer SANS L'AVOIR VOULU en est un : le script relance toute
          # erreur qu'il ne reconnaît pas, et le message brut d'un pilote nomme
          # l'hébergeur et la région (D50). Un `tee` rendait cela au journal à
          # l'instant même où c'était produit — trop tard pour le masquer.
          code=0
          pnpm exec tsx scripts/societe-initiale.mts \
            --code "$CODE" --raison-sociale "$RAISON" --pays "$PAYS" \
            --territoire "$TERRITOIRE" --fuseau "$FUSEAU" --devise "$DEVISE" \
            --langue "$LANGUE" --majoration "$MAJORATION" \
            > /tmp/societe.txt 2>&1 || code=$?

          # PREMIÈRE BARRIÈRE — le masque, posé AVANT tout rendu :
          # « ::add-mask:: » ne vaut que pour la suite du journal, jamais pour
          # ce qui est déjà écrit.
          grep -oE '[a-z0-9+.-]+://[^[:space:]]+' /tmp/societe.txt > /tmp/urls-societe.txt || true
          while IFS= read -r url; do
            [ -n "$url" ] || continue
            echo "::add-mask::$url"
          done < /tmp/urls-societe.txt

          # SECONDE BARRIÈRE — le retrait. C'est elle qui garde : un masque
          # dépend d'une reconnaissance de chaîne et ne survit pas à un
          # découpage sur deux lignes. Les deux ne se recouvrent pas.
          sed -E 's#[a-z0-9+.-]+://[^[:space:]]+#(URL RETIRÉE DU JOURNAL)#g' \
            /tmp/societe.txt > /tmp/societe-expurge.txt
          cat /tmp/societe-expurge.txt
          exit $code

      # L'identifiant de la société est ce que le geste suivant réclame. Il
      # n'est pas un secret — c'est un UUID de ligne — et il se relit en base ;
      # le porter au résumé évite de fouiller le journal depuis un téléphone.
      # Le résumé a EXACTEMENT la même visibilité que le journal : il reçoit
      # donc la version EXPURGÉE, jamais la brute.
      - name: Reporter l'identifiant de la société
        if: ${{ always() && inputs.creer_societe }}
        run: |
          {
            echo "## Société ouverte"
            echo
            echo '```'
            cat /tmp/societe-expurge.txt 2>/dev/null || echo "(aucune sortie : le geste a été refusé, voir le journal)"
            echo '```'
            echo
            echo "Reportez l'identifiant dans le flux **Ouvrir le PREMIER compte**."
          } >> "$GITHUB_STEP_SUMMARY"

      # ── LE PREMIER TAUX HORAIRE (AMORCAGE-2, 22/09/2026) ──────────────────
      #
      # `scripts/taux-initial.mts` existait depuis le 10/09 et n'avait AUCUN
      # flux : il exigeait un terminal branché sur la base de production. Le
      # geste reste SÉPARÉ de l'ouverture de la société — un problème de tarif
      # ne doit pas bloquer le seul chemin d'entrée dans le produit (décision
      # du 09/09) —, d'où sa propre case, et une société NOMMÉE par son
      # identifiant plutôt que devinée : une seule société en base ne veut pas
      # dire « celle-là ».
      #
      # LE TAUX EST UN PRIX. Il se reçoit en argument, il n'a AUCUNE valeur par
      # défaut, et l'étape refuse un montant vide AVANT d'appeler le script — le
      # script refuserait aussi, mais en parlant d'un entier, pas d'un prix
      # (CLAUDE.md §8, même règle que la majoration ci-dessus). Le montant est
      # un ENTIER dans l'unité la plus fine de la devise de la société (I3), et
      # le script le RÉPÈTE formaté : relire cette ligne dans le résumé, une
      # erreur d'échelle se voit là avant d'être facturée.
      - name: Poser le premier taux horaire
        if: ${{ inputs.poser_taux }}
        env:
          TAUX_INITIAL_CONFIRME: "oui"
          SOCIETE: ${{ inputs.societe }}
          MONTANT: ${{ inputs.montant }}
          DATE_EFFET: ${{ inputs.date_effet }}
        run: |
          set -uo pipefail
          if [ -z "$SOCIETE" ]; then
            echo "::error::Le champ « societe » est vide. Le taux se pose sur une société NOMMÉE par son identifiant — celui que le geste d'ouverture a rendu."
            exit 1
          fi
          if [ -z "$MONTANT" ]; then
            echo "::error::Le champ « montant » est vide. Un taux horaire est un PRIX : il n'a aucune valeur par défaut, et ce flux n'en invente pas (CLAUDE.md §8)."
            exit 1
          fi
          # `--date` n'est passé que s'il est renseigné : le script prend alors
          # le jour du geste dans le fuseau de la société, et c'est SA règle.
          date_argument=()
          if [ -n "$DATE_EFFET" ]; then
            date_argument=(--date "$DATE_EFFET")
          fi

          # MÊME FORME QUE « Ouvrir la première société » : la sortie va dans
          # un fichier, jamais dans le journal. Ce que ce geste imprime
          # volontairement n'est pas un secret — un taux formaté. Ce qu'il peut
          # imprimer SANS L'AVOIR VOULU en est un : le script relance toute
          # erreur qu'il ne reconnaît pas, et le message brut d'un pilote nomme
          # l'hébergeur et la région (D50).
          code=0
          pnpm exec tsx scripts/taux-initial.mts \
            --societe "$SOCIETE" --montant "$MONTANT" "${date_argument[@]}" \
            > /tmp/taux.txt 2>&1 || code=$?

          # PREMIÈRE BARRIÈRE — le masque, posé AVANT tout rendu.
          grep -oE '[a-z0-9+.-]+://[^[:space:]]+' /tmp/taux.txt > /tmp/urls-taux.txt || true
          while IFS= read -r url; do
            [ -n "$url" ] || continue
            echo "::add-mask::$url"
          done < /tmp/urls-taux.txt

          # SECONDE BARRIÈRE — le retrait, qui garde même quand le masque ne
          # reconnaît pas la chaîne.
          sed -E 's#[a-z0-9+.-]+://[^[:space:]]+#(URL RETIRÉE DU JOURNAL)#g' \
            /tmp/taux.txt > /tmp/taux-expurge.txt
          cat /tmp/taux-expurge.txt
          exit $code

      # Le résumé a la même visibilité que le journal : il reçoit l'EXPURGÉ.
      # Le taux FORMATÉ y est ce qu'il faut relire : le script refuse ensuite
      # de rejouer, et une erreur d'échelle se corrige par le chemin ordinaire.
      - name: Reporter le taux horaire posé
        if: ${{ always() && inputs.poser_taux }}
        run: |
          {
            echo "## Premier taux horaire"
            echo
            echo '```'
            cat /tmp/taux-expurge.txt 2>/dev/null || echo "(aucune sortie : le geste a été refusé, voir le journal)"
            echo '```'
            echo
            echo "Relire le taux FORMATÉ ci-dessus : le geste ne se rejoue pas, une erreur d'échelle passe par le chemin ordinaire."
          } >> "$GITHUB_STEP_SUMMARY"

      # ── L'HORIZON DES JOURS FÉRIÉS (AMORCAGE-2, 22/09/2026) ───────────────
      #
      # `pnpm feries:etendre` existait depuis L0-08 et n'avait AUCUN flux. Sans
      # lui, une table de fériés alimentée une fois se périme en silence et le
      # planning propose des créneaux un 1ᵉʳ mai (§9, 21/08 ; D46).
      #
      # L'ORDRE COMPTE, et l'étape est la DERNIÈRE pour cela : les fériés se
      # posent par TERRITOIRE, et le territoire est lu sur les AGENCES — jamais
      # deviné, jamais passé en argument. Or une agence appartient à une
      # société, et se crée dans l'application une fois le premier compte
      # ouvert : sur une base neuve, ce geste se joue donc lors d'une
      # exécution ULTÉRIEURE, après la première agence. Tant qu'aucune agence
      # n'existe, le SCRIPT refuse en le nommant — « Aucun territoire n'est
      # rattaché à une agence » — et l'étape rougit avec cette phrase ; elle
      # n'invente pas de territoire à sa place. Rejouable sans dommage : la clé
      # naturelle est (territoire, date), et aucune ligne existante n'est
      # touchée.
      #
      # La base est visée DÉLIBÉRÉMENT par HORIZON_DATABASE_URL, première
      # variable que la lecture regarde : « un contrôle d'exploitation se
      # demande, il ne s'attrape pas » (scripts/lib/feries.ts). L'écriture dans
      # `jour_ferie` exige le propriétaire ou un rôle éditeur (D46) — c'est
      # l'URL de migration du flux.
      #
      # ── CE QUE CE BOUTON NE POUVAIT PAS FAIRE SUR UNE BASE HÉBERGÉE — RÉPARÉ
      # (FERIES-1, 22/09/2026) ────────────────────────────────────────────────
      # MESURÉ LE 22/09/2026, en rejouant la chaîne sur une base neuve migrée
      # par un propriétaire NON superutilisateur — le rôle de migration tel
      # qu'un hébergeur le donne : avec UNE agence en base, le script refusait
      # « Aucun territoire n'est rattaché à une agence » ; la même base sous
      # un superutilisateur ajoutait 36 fériés. `agence` porte FORCE ROW LEVEL
      # SECURITY et `lireAgences` (scripts/lib/feries.ts) la lisait sans
      # contexte ni identité exemptée : le propriétaire voyait ZÉRO ligne et
      # le script se croyait sans agence — le §9 du 07/09, mot pour mot.
      #
      # DEPUIS FERIES-1, la lecture prend l'identité exemptée — le rôle
      # connecté s'il l'est, sinon un rôle exempté dont il est membre, par
      # SET LOCAL ROLE, EXACTEMENT comme scripts/inventaire.mts à chaque
      # migration — et REFUSE de conclure à défaut, en nommant le rôle, la
      # base et la variable. Ce flux n'a donc AUCUNE variable de plus : la
      # même URL de migration qui permet l'inventaire permet cette lecture.
      # Rejoué sous un propriétaire non superutilisateur membre d'un rôle
      # BYPASSRLS : 36 fériés ajoutés. Sans aucune exemption accessible :
      # « Lecture des agences pour l'horizon des fériés impossible : le rôle
      # « … » sur la base « … » est soumis aux politiques de cloisonnement »
      # — et jamais plus un faux « aucun territoire ».
      - name: Étendre l'horizon des jours fériés
        if: ${{ inputs.etendre_feries }}
        env:
          HORIZON_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          set -uo pipefail
          # MÊME FORME QUE « Ouvrir la première société » : sortie dans un
          # fichier, masque, puis retrait — le script relance les erreurs de
          # pilote telles quelles, et elles nomment l'hébergeur (D50).
          code=0
          pnpm feries:etendre > /tmp/feries.txt 2>&1 || code=$?

          grep -oE '[a-z0-9+.-]+://[^[:space:]]+' /tmp/feries.txt > /tmp/urls-feries.txt || true
          while IFS= read -r url; do
            [ -n "$url" ] || continue
            echo "::add-mask::$url"
          done < /tmp/urls-feries.txt

          sed -E 's#[a-z0-9+.-]+://[^[:space:]]+#(URL RETIRÉE DU JOURNAL)#g' \
            /tmp/feries.txt > /tmp/feries-expurge.txt
          cat /tmp/feries-expurge.txt
          exit $code

      # L'horizon AVANT et APRÈS, territoire par territoire, tel que le script
      # l'imprime — et le refus « aucun territoire » s'il n'y avait pas encore
      # d'agence, pour que le lecteur sache que c'est l'ORDRE, pas la base.
      - name: Reporter l'horizon des fériés
        if: ${{ always() && inputs.etendre_feries }}
        run: |
          {
            echo "## Horizon des jours fériés"
            echo
            echo '```'
            cat /tmp/feries-expurge.txt 2>/dev/null || echo "(aucune sortie : le geste a été refusé, voir le journal)"
            echo '```'
            echo
            echo "« Aucun territoire n'est rattaché à une agence » n'a qu'UNE cause depuis FERIES-1 (22/09/2026) : aucune agence n'existe encore — en créer une dans l'application, puis rejouer ce seul geste. Le cas où elle existe sans que le rôle la voie (cloisonnement forcé sur « agence ») ne se confond plus avec lui : le script refuse alors en nommant le rôle, la base et la variable à alimenter — « … est soumis aux politiques de cloisonnement » —, et le remède est un rôle de migration exempté des politiques ou membre d'un tel rôle, le même que l'inventaire exige à chaque migration."
          } >> "$GITHUB_STEP_SUMMARY"
