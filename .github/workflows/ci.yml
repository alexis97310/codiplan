name: CI

# Arbitrage D14 — deux portes :
#   verify       à chaque poussée et sur chaque proposition de fusion ;
#   verify:full  sur main et chaque nuit.
#
# ── CE DÉPÔT EST PUBLIC DEPUIS LE 12/09/2026 ───────────────────────────────
# GitHub désactive les flux planifiés d'un dépôt PUBLIC après 60 jours sans
# activité — et un fork les désactive d'emblée. La planification ci-dessous
# s'arrêtera donc un jour SANS QUE RIEN NE LE DISE : une planification
# désactivée ne produit aucune exécution, donc aucun échec, donc aucune
# alarme. Le job `battement` garde ce cas-là, et lui seul.
#
# La mise en garde qui occupait ces lignes était écrite AU FUTUR — « avant de
# rendre ce dépôt public » —, et ce futur est advenu. Le fait, lui, ne bouge
# pas : É12 de la revue R0, § 9 du CLAUDE.md, « le silence a exactement la
# forme du succès ».
on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    # 15h00 UTC = 02h00 à Nouméa (UTC+11, sans changement d'heure).
    - cron: "0 15 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  verify:
    name: verify
    # Sur main et la nuit, verify est couvert par verify:full — inutile de le jouer deux fois.
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # PostgreSQL local jetable pour `pnpm test:isolation` (L0-05). Jamais Neon :
    # les tests d'isolation ne touchent que cette base éphémère, recréée à chaque
    # exécution. Auth « trust » : le rôle applicatif restreint des tests
    # (codiplan_test_app) se connecte sans mot de passe.
    env:
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/codiplan_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: codiplan_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: pnpm verify
        run: pnpm verify

  verify-full:
    name: verify:full
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # DEUX bases locales jetables sur le MÊME serveur, et elles ne se
    # recouvrent pas :
    #   — `codiplan_test` : le harnais d'isolation, qui recrée son schéma et
    #     pose des tables fixtures ;
    #   — `codiplan_e2e`  : les scénarios de bout en bout, qui exigent au
    #     contraire une base MIGRÉE et SEMÉE comme la production (R2-18). Le
    #     harnais la détruit et la recrée lui-même à chaque exécution.
    # Les mêler ferait mesurer aux scénarios d'écran un schéma que la migration
    # n'a pas écrit.
    env:
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/codiplan_test
      E2E_DATABASE_URL: postgresql://postgres@localhost:5432/codiplan_e2e
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: codiplan_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      # `fetch-depth: 2` — il en faut DEUX pour savoir ce que cette poussée a
      # changé. Le défaut de `checkout` est 1, et `git diff HEAD^ HEAD` n'a
      # alors aucun HEAD^ à comparer. Deux commits suffisent : le premier parent
      # d'une fusion est `main` tel qu'il était, quel que soit le mode de fusion.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      # ── L'AVERTISSEMENT DE MIGRATION — MÉCANIQUE, ET NON MÉMORIEL ──────────
      #
      # **Ce qu'il répare, et c'est une règle de ce dépôt qui a cédé.** Le §12 de
      # la consigne d'exploitation demandait que tout travail touchant `prisma/`
      # finisse par un geste NOMMÉ. La règle était écrite, elle était juste — et
      # la fusion #157 a porté une migration sans que le geste l'accompagne.
      # *Une règle écrite dans un document que personne ne relit au bon moment
      # n'est pas un gardien* : elle a exactement la forme d'un gardien, et elle
      # ne produit aucun signal quand on l'oublie (§9, 31/08 — le silence a la
      # forme du succès).
      #
      # Ce qui la rend mécanique est ici : **la fusion elle-même écrit
      # l'avertissement**, dans le résumé de l'exécution qu'elle déclenche.
      # Personne n'a plus à se souvenir.
      #
      # **Il est GRATUIT, et c'est la raison de sa place.** Un job coûte une
      # minute pleine quelle que soit sa durée (§9, 12/09) ; cette étape vit
      # donc DANS un job qui tourne déjà, et ajoute deux secondes à une
      # exécution de huit minutes.
      #
      # **Et il n'est PAS le contrôle.** Il rappelle un geste ; c'est le job
      # `deploiement` ci-dessous qui MESURE si la base a suivi. Un rappel se
      # lit ou ne se lit pas ; une mesure rougit. Les deux, parce que le rappel
      # arrive tout de suite et la mesure huit minutes plus tard.
      - name: Avertir qu'une migration accompagne cette fusion
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          # LE TÉMOIN : AI-JE PU REGARDER ? Avec la profondeur 1 de `checkout`,
          # `HEAD^` n'existe pas, `git diff` échoue, et un `|| true` rendrait
          # alors la liste VIDE — c'est-à-dire « aucune migration », en silence.
          # *Un décompte nul ressemble toujours à un sans-faute* (§9, 30/08) :
          # l'avertissement aurait disparu sans que rien ne le dise. On refuse
          # plutôt que de conclure sur ce qu'on n'a pas pu lire.
          if ! git rev-parse --verify --quiet HEAD^ >/dev/null; then
            echo "::error::HEAD^ est hors de portée : ce contrôle n'a pas pu comparer cette poussée à la précédente, et il ne conclut donc rien. Rendre fetch-depth: 2 au checkout de ce job."
            exit 1
          fi
          migrations=$(git diff --name-only HEAD^ HEAD -- prisma/migrations/)
          if [ -z "$migrations" ]; then
            echo "Aucune migration dans cette poussée." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## ⚠ Cette fusion porte une MIGRATION"
            echo
            echo "La base déployée ne l'a pas encore. Tant qu'elle ne l'a pas, tout"
            echo "écran qui lit une colonne nouvelle rend une exception serveur —"
            echo "c'est la panne du 11/09 et celle du 12/09, trois fois la même."
            echo
            echo "**Le geste :** Actions → « DB migrate & seed » → Run workflow —"
            echo "*Use workflow from* : \`main\` · *Quelle base ?* : \`demonstration\` ·"
            echo "*Purger les données de démonstration* : **décoché**."
            echo
            echo "Fichiers concernés :"
            echo
            echo '```'
            echo "$migrations"
            echo '```'
            echo
            echo "Le job \`deploiement\` de cette même exécution le vérifie pour de"
            echo "bon : il rougit et ouvre une issue si la base est restée en arrière."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      # LE NAVIGATEUR EST MIS EN CACHE, ET L'INSTALLATION EST JOUÉE QUAND MÊME.
      #
      # *Mesuré le 12/09/2026 sur l'exécution 34662151699 : 23 secondes.* Ce
      # n'est pas énorme, et c'est écrit pour qu'on ne le croie pas énorme :
      # sur un job de 541 secondes facturé 10 minutes, 23 secondes ne font
      # basculer l'arrondi qu'environ deux fois sur cinq.
      #
      # **La forme choisie ne peut pas casser.** Le cache est posé AVANT, et
      # l'installation est jouée APRÈS dans tous les cas : sur un cache présent
      # elle constate et rend la main en deux secondes, sur un cache absent ou
      # incomplet elle fait exactement ce qu'elle faisait hier. *Un cache dont
      # le pire cas est le comportement d'avant n'a pas de mode de défaillance*
      # — et c'est la seule raison pour laquelle il entre dans un commit qu'on
      # ne peut pas se permettre de reprendre.
      #
      # `--with-deps` installe aussi des paquets système, que ce cache ne
      # couvre pas : il n'y a donc rien à gagner de plus ici, et l'écrire évite
      # qu'on cherche pourquoi le gain est petit.
      - name: Cache du navigateur Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Installer le navigateur Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: pnpm verify:full
        run: pnpm verify:full

      - name: Rapport Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # ── LA VEILLE DE LA BASE HÉBERGÉE — le détectif, à échéance fixe ────────────
  #
  # **Ce qu'elle répare, et il a été mesuré.** Les contrôles détectifs du dépôt
  # — état RLS, formes de politique, privilèges du journal, durcissement des
  # partitions, privilèges de consolidation, périmètre d'audit — ne
  # s'exécutaient que dans `db-migrate.yml`, dont le déclencheur est
  # `workflow_dispatch` ET LUI SEUL, par une décision explicite : une migration
  # ne doit jamais partir toute seule. Et le `verify:full` ci-dessus tourne
  # contre le PostgreSQL JETABLE du service ci-dessus, jamais contre Neon.
  #
  # Conséquence : le détectif n'avait jamais regardé l'endroit où la faute se
  # produirait. Il ne voyait la base hébergée que lorsqu'un humain cliquait pour
  # migrer — et entre deux migrations, il peut se passer des semaines. Une
  # garantie dont le déclenchement dépend de l'initiative de quelqu'un n'est pas
  # une garantie, c'est une intention.
  #
  # **Elle tourne sous le rôle APPLICATIF, le moins doté qui voie le catalogue.**
  # Une première rédaction employait le rôle de MIGRATION, parce que
  # `information_schema.role_table_grants` n'est lisible que pour les droits dont
  # le rôle connecté est bénéficiaire ou concédant. On exposait ainsi chaque
  # nuit, dans un travail automatique, une accréditation capable de tout écrire —
  # pour lire un catalogue. Les privilèges se lisent désormais dans
  # `pg_class.relacl` (`aclexplode`), que n'importe quel rôle voit : mêmes
  # lignes, mesuré, et plus aucun secret privilégié sur ce chemin.
  #
  # **Et elle est en LECTURE SEULE, par la base.** Toute la veille tient dans une
  # transaction ouverte par `SET TRANSACTION READ ONLY` : PostgreSQL refuse alors
  # les quatre verbes d'écriture ET tout le DDL. Le verrou protège de l'accident,
  # le rôle protège de l'accréditation — ce ne sont pas les mêmes risques.
  #
  # Elle ne migre pas, n'amorce pas, ne purge pas. Un scénario d'isolation mesure
  # l'effet du verrou plutôt que de le croire.
  #
  # **DEUX ROUGES, PAS UN.** Neon suspend une base inactive, et le premier réveil
  # peut expirer. Une veille qui rendrait le même rouge dans les deux cas
  # apprendrait en trois semaines à ne plus être lue — et l'on aurait reconstruit
  # É12 avec plus de machinerie. Le script sort en 75 (`EX_TEMPFAIL`) quand la
  # base est INJOIGNABLE, en 1 quand elle a été jointe et qu'elle a dérivé. Le
  # job publie la nature, et l'alarme n'ouvre pas la même issue.
  veille-hebergee:
    name: veille — base hébergée
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      nature: ${{ steps.veille.outputs.nature }}
      # D'OÙ VIENDRAIT UN ÉCART — MESURÉ par la veille, jamais affirmé par ce
      # fichier (R1-01). Le gabarit lisait « ce sont des gestes passés à la
      # main » quoi qu'il arrive ; la veille, qui n'observe que la base, ne
      # pouvait pas le savoir.
      provenance: ${{ steps.veille.outputs.provenance }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: pnpm veille
        id: veille
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set +e
          pnpm veille
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            nature=verte
          elif [ "$code" -eq 75 ]; then
            nature=liaison
          else
            nature=securite
          fi
          echo "nature=$nature" >> "$GITHUB_OUTPUT"
          exit "$code"

  # ── LA VÉRIFICATION APRÈS DÉPLOIEMENT (R3-01) — la porte qui manquait ───────
  #
  # **TROIS pannes de production en deux jours, toutes la même.** Du code sur
  # `main` qui lit une colonne qu'une migration non appliquée devait créer. La
  # première a duré 4 h 03 min et personne ne l'a su ; la troisième, `/sante`
  # nommait la cause en une ligne — *et personne ne l'avait ouverte.* **Une
  # sonde que personne n'ouvre ne sonne pas** : ce job est ce qui l'ouvre.
  #
  # **Ce que les portes existantes ne pouvaient pas voir.** `verify:full` tourne
  # contre une base FRAÎCHEMENT migrée ; la production contre une base migrée à
  # un autre moment. Les commandes sont les mêmes, l'ÉTAT DU MONDE diffère, et
  # rien ne confrontait les deux (§9, 11/09). Ce job est le seul du dépôt qui
  # regarde le déploiement lui-même.
  #
  # **Il ne migre RIEN**, et c'est écrit au ticket : une migration ne part jamais
  # toute seule (`db-migrate.yml`, décision du 20/08). Il NOMME le geste ; un
  # humain le joue, et le regarde.
  #
  # **`needs: [verify-full]`, et ce n'est pas une dépendance logique — c'est ce
  # qui le fait coûter UNE minute.** Un job est facturé à la minute supérieure
  # (§9, 12/09) ; lancé au moment de la poussée, ce contrôle passerait deux
  # minutes à réessayer en attendant la fin du déploiement, donc trois minutes
  # facturées. Placé après `verify:full` — huit minutes plus tard —, le
  # déploiement est achevé depuis longtemps et la première tentative suffit :
  # ~25 secondes, une minute facturée. *Le budget de réessai reste, pour le jour
  # où l'hébergeur sera plus lent que notre CI.*
  #
  # **Et il ne se tait jamais.** Sans la variable `URL_PRODUCTION`, il ne rend
  # pas la main en vert : il rougit en nommant où la poser. *Un contrôle qui
  # saute quand il n'est pas configuré est le contrôle qu'on croit avoir.*
  deploiement:
    name: déploiement — la base a-t-elle suivi ?
    needs: [verify-full]
    # `always()` : l'état du déploiement est indépendant de la santé du dépôt.
    # Un `verify:full` rouge ne dit rien de ce qui est en ligne, et c'est
    # précisément un moment où l'on veut savoir.
    if: >-
      always() && (github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      nature: ${{ steps.controle.outputs.nature }}
      code: ${{ steps.controle.outputs.code }}
      detail: ${{ steps.controle.outputs.detail }}
      geste: ${{ steps.controle.outputs.geste }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      # `COMMIT_ATTENDU` n'est posé que sur une POUSSÉE, et c'est une décision.
      # Sur une poussée, le contrôle doit mesurer LE CODE DE CETTE FUSION : sans
      # ce témoin, il interrogerait l'ancienne version — qui répond « tout va
      # bien » en toute sincérité — et rendrait un vert dans la fenêtre même où
      # la panne naît (§9, 30/08). Une exécution planifiée, elle, ne vise aucune
      # fusion : elle demande si ce qui est en ligne va bien, et le contrôle dit
      # alors qu'il ne visait rien plutôt que de laisser croire le contraire.
      #
      # `URL_PRODUCTION` est une VARIABLE, pas un secret : c'est une adresse
      # publique, qu'on lit dans un navigateur. La ranger parmi les secrets
      # apprendrait à ranger n'importe quoi parmi les secrets.
      - name: pnpm deploiement:verifier
        id: controle
        env:
          URL_PRODUCTION: ${{ vars.URL_PRODUCTION }}
          COMMIT_ATTENDU: ${{ github.event_name == 'push' && github.sha || '' }}
        run: pnpm deploiement:verifier

  # ── (a) L'ALARME — une nuit rouge ouvre une ISSUE ───────────────────────────
  #
  # Écart É12 de la revue R0. Constaté, non supposé : GitHub notifie bien par
  # courriel l'échec d'une exécution, et les DEUX notifications d'échec du
  # 20 août sont restées NON LUES. Pour un flux planifié, la notification part
  # au dernier compte ayant modifié le `cron` — ici la même boîte. L'alarme
  # sonnait donc, dans une pièce vide.
  #
  # Une issue rend la question du courriel sans objet : elle est créée quoi
  # qu'il arrive, elle vit DANS le dépôt, et sa notification suit un autre
  # chemin que celui qui a laissé passer les deux échecs du 20 août.
  #
  # Elle ne se déclenche que sur les exécutions que PERSONNE NE REGARDE —
  # planification, poussée sur `main`, déclenchement manuel. L'échec d'une
  # proposition de fusion a déjà un lecteur : celui qui l'a ouverte.
  alarme-nuit-rouge:
    name: alarme — nuit rouge
    # La veille rejoint la nuit : une base hébergée qui a dérivé est une nuit
    # rouge au même titre qu'un `verify:full` cassé, et elle mérite la même
    # issue. Sans cela, la veille aurait sonné dans la boîte de courriel que le
    # 20 août a montrée vide.
    #
    # LE DÉPLOIEMENT REJOINT LA NUIT (R3-01). Une base déployée restée en
    # arrière est un incident au même titre qu'un `verify:full` cassé, et il
    # mérite mieux qu'une ligne dans un journal que personne n'ouvre : c'est
    # très exactement la panne du 12/09, où `/sante` disait la cause et où
    # personne ne l'avait lue.
    needs: [verify-full, veille-hebergee, deploiement]
    if: >-
      always() && (needs.verify-full.result == 'failure' ||
      needs.veille-hebergee.result == 'failure' ||
      needs.deploiement.result == 'failure')
    runs-on: ubuntu-latest
    # `contents: read` est là pour la même raison qu'au job `battement` : le
    # bloc remplace l'ensemble des droits. Ce job ne fait pas de `checkout`,
    # mais `gh` résout le dépôt avant d'agir — et ce chemin-ci ne s'exécute
    # QUE lorsque quelque chose est déjà cassé. C'est le pire moment pour
    # découvrir qu'il manquait un droit.
    permissions:
      contents: read
      issues: write
    steps:
      - name: Ouvrir ou compléter l'issue de nuit rouge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPOT: ${{ github.repository }}
          LIEN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DECLENCHEUR: ${{ github.event_name }}
          COMMIT: ${{ github.sha }}
          RESULTAT_VERIFY: ${{ needs.verify-full.result }}
          RESULTAT_VEILLE: ${{ needs.veille-hebergee.result }}
          NATURE_VEILLE: ${{ needs.veille-hebergee.outputs.nature }}
          # `set -u` est actif, et une veille SAUTÉE ne publie aucune sortie :
          # le défaut dit alors ce qu'il en est, plutôt que de laisser un vide
          # qui se lirait « rien en retard ».
          PROVENANCE_VEILLE: "${{ needs.veille-hebergee.outputs.provenance || 'La provenance du retard des migrations n''a pas été mesurée — la veille n''a pas tourné.' }}"
          RESULTAT_DEPLOIEMENT: ${{ needs.deploiement.result }}
          NATURE_DEPLOIEMENT: ${{ needs.deploiement.outputs.nature }}
          CODE_DEPLOIEMENT: ${{ needs.deploiement.outputs.code }}
          DETAIL_DEPLOIEMENT: ${{ needs.deploiement.outputs.detail }}
          GESTE_DEPLOIEMENT: ${{ needs.deploiement.outputs.geste }}
        run: |
          set -euo pipefail
          # CINQ marqueurs, donc CINQ fils d'issues. Une nuit injoignable est
          # un incident d'EXPLOITATION ; une base qui a dérivé est un incident de
          # SÉCURITÉ ; une base déployée en retard demande une migration ; une
          # application qui tourne sous le mauvais rôle est un cloisonnement
          # tombé ; un déploiement qu'on n'a pas pu joindre ne dit rien du tout.
          # Les mêler apprendrait à ne plus lire aucun des cinq.
          #
          # ── LE DÉPLOIEMENT EST JUGÉ EN PREMIER, et ce n'est pas arbitraire ──
          #
          # C'est le seul des trois dont la cause soit DÉJÀ connue et le geste
          # DÉJÀ écrit : la base est en retard, il faut migrer. Une nuit rouge
          # et une base qui a dérivé demandent une enquête ; celle-ci demande
          # un clic. La nommer en second la rangerait derrière des incidents
          # qu'on ne sait pas encore traiter.
          #
          # DEUX natures, DEUX fils, et la distinction est celle de la veille :
          # « je n'ai rien pu constater » n'est pas « j'ai constaté un écart ».
          # Les mêler apprendrait à ne lire ni l'un ni l'autre.
          #
          # Le détail et le geste viennent du CONTRÔLE, jamais de ce fichier :
          # les recopier ici ferait deux rédactions d'un même texte, dont la
          # seconde deviendrait fausse sans rougir (§9, 01/09).
          # `set -u` est actif : une variable non posée ferait échouer l'alarme
          # elle-même, au moment précis où elle est le seul canal qui reste.
          GESTE=""
          if [ "$RESULTAT_DEPLOIEMENT" = "failure" ] && [ "$NATURE_DEPLOIEMENT" = "migration_manquante" ]; then
            MARQUEUR='[deploiement-en-retard]'
            TITRE="$MARQUEUR la base déployée est en retard sur le code déployé"
            NATURE="**LA PRODUCTION EST CASSÉE, OU VA L'ÊTRE.** $DETAIL_DEPLOIEMENT"
            GESTE="$GESTE_DEPLOIEMENT"
          elif [ "$RESULTAT_DEPLOIEMENT" = "failure" ] && [ "$NATURE_DEPLOIEMENT" = "role_inattendu" ]; then
            MARQUEUR='[deploiement-cloisonnement]'
            TITRE="$MARQUEUR l'application déployée ne tourne pas sous le rôle applicatif"
            NATURE="**INCIDENT DE SÉCURITÉ.** $DETAIL_DEPLOIEMENT"
            GESTE="$GESTE_DEPLOIEMENT"
          elif [ "$RESULTAT_DEPLOIEMENT" = "failure" ]; then
            MARQUEUR='[deploiement-incertain]'
            TITRE="$MARQUEUR le contrôle du déploiement a rougi"
            # LE CORPS NE DÉCIDE PAS SI QUELQUE CHOSE A ÉTÉ CONSTATÉ — il le
            # LIT. Une rédaction unique disant « rien n'a été constaté »
            # couvrirait aussi l'adresse absente et le contrat divergent, qui
            # sont des écarts bien constatés : *une cause imprimée quoi qu'il
            # arrive est une opinion que le dispositif répète en votre nom*
            # (§9, 10/09). Le code de sortie vient du contrôle, et c'est lui
            # qui porte la distinction.
            if [ "$CODE_DEPLOIEMENT" = "75" ]; then
              NATURE="**Incident d'EXPLOITATION — RIEN n'a pu être constaté** (code 75). Ce rouge ne dit RIEN de l'état de la base : il dit que le contrôle n'a pas pu regarder. Nature : \`$NATURE_DEPLOIEMENT\`. $DETAIL_DEPLOIEMENT"
            else
              NATURE="**Écart CONSTATÉ** (code \`$CODE_DEPLOIEMENT\`), nature \`$NATURE_DEPLOIEMENT\`. $DETAIL_DEPLOIEMENT"
            fi
            GESTE="$GESTE_DEPLOIEMENT"
          elif [ "$NATURE_VEILLE" = "liaison" ]; then
            MARQUEUR='[veille-injoignable]'
            TITRE="$MARQUEUR la base hébergée n'a pas pu être jointe"
            NATURE="**Incident d'EXPLOITATION — RIEN n'a été constaté.** La veille n'est pas allée au bout de son observation : ce rouge ne dit RIEN de l'état de la base. $PROVENANCE_VEILLE"
          elif [ "$NATURE_VEILLE" = "securite" ]; then
            MARQUEUR='[veille-securite]'
            TITRE="$MARQUEUR la base hébergée a DÉRIVÉ"
            # LA PROVENANCE VIENT DU CONTRÔLE, jamais de ce fichier. C'est R1-01,
            # et c'est la même règle que la branche « déploiement » ci-dessus
            # applique déjà : le corps ne DÉCIDE pas d'où vient un écart, il le
            # LIT. La phrase qui était écrite ici affirmait un geste manuel que
            # la veille n'avait jamais mesuré — et le 12/09/2026 elle l'a
            # affirmé sur une alarme où la veille n'avait rien observé du tout.
            NATURE="**Incident de SÉCURITÉ.** La base a été jointe et observée : elle s'écarte de ce que le dépôt exige. $PROVENANCE_VEILLE"
          else
            MARQUEUR='[nuit-rouge]'
            TITRE="$MARQUEUR la vérification nocturne a échoué"
            NATURE="**Vérification nocturne rouge.**"
          fi

          # Le geste, quand le contrôle en a nommé un. Un « Le geste : » suivi de
          # rien serait pire qu'une absence, puisqu'il promet quelque chose.
          LIGNE_GESTE=""
          if [ -n "$GESTE" ]; then
            LIGNE_GESTE="**Le geste :** $GESTE"
          fi

          # Le corps est assemblé par `printf`, jamais par un document en ligne :
          # un `<<TEXTE` dont le délimiteur est indenté — et il l'est forcément,
          # dans un bloc YAML — ne se referme pas. Éprouvé avec un `gh` factice
          # avant d'être livré.
          printf '%s\n' \
            "$NATURE" \
            '' \
            "$LIGNE_GESTE" \
            '' \
            "\`verify:full\` : $RESULTAT_VERIFY — veille de la base hébergée : $RESULTAT_VEILLE ($NATURE_VEILLE) — déploiement : $RESULTAT_DEPLOIEMENT ($NATURE_DEPLOIEMENT)." \
            '' \
            "| | |" \
            "|---|---|" \
            "| Déclencheur | \`$DECLENCHEUR\` |" \
            "| Exécution | $LIEN |" \
            "| Commit | \`$COMMIT\` |" \
            '' \
            "Issue ouverte automatiquement (ticket R0-a, écart É12) : une alarme" \
            "qui sonne dans une boîte de courriel que personne ne lit n'est pas" \
            "une alarme. Elle se referme à la main, une fois la cause traitée." \
            '' \
            "Ce qu'elle ne peut PAS détecter, et qui a son propre contrôle : une" \
            "planification **désactivée** ne produit aucune exécution, donc aucun" \
            "échec, donc aucune issue. C'est le job \`battement\` qui garde ce" \
            "cas-là — voir le §9 du CLAUDE.md." \
            > corps-nuit-rouge.md

          # ── LE CORPS EST ÉCRIT AVANT TOUTE TENTATIVE D'OUVERTURE ──────────
          #
          # **Mesuré le 12/09/2026, et c'est un canal CLOS qu'on a découvert** :
          # `gh` a répondu *« the repository has disabled issues »*. L'écart É12
          # avait été fermé le 31/08 par la phrase « une issue rend la question
          # du courriel sans objet : elle vit DANS le dépôt » — et ce dépôt-ci
          # n'a plus d'issues. Toute nuit rouge sonnait donc **dans le vide**,
          # exactement la pièce vide du 20 août sous un autre costume.
          #
          # *Une alarme qui ne peut pas sonner doit le dire, ET dire quand même
          # ce qu'elle avait à dire.* Le corps part donc d'abord dans le résumé
          # de l'exécution et en annotation — deux canaux que rien ne peut
          # désactiver —, et l'issue n'est qu'un troisième. Sans cela, fermer le
          # canal faisait disparaître le CONTENU en même temps que la sonnerie.
          {
            echo "## $TITRE"
            echo
            cat corps-nuit-rouge.md
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=$MARQUEUR::$NATURE"

          # Une issue par ÉPISODE, pas une par nuit : tant que la précédente est
          # ouverte, on la complète. Sans cela, une semaine rouge produirait sept
          # issues et l'alarme deviendrait le bruit qu'elle devait remplacer.
          #
          # `set -e` est actif : chaque appel à `gh` est donc explicitement
          # neutralisé, et son échec est JUGÉ plutôt que de terminer le pas sur
          # place. *Un `gh` qui tombe après le résumé ne doit pas faire perdre le
          # résumé.*
          CANAL_OUVERT=oui
          EXISTANTE=$(gh issue list --repo "$DEPOT" --state open --limit 50 \
            --json number,title \
            --jq "[.[] | select(.title | contains(\"$MARQUEUR\"))] | .[0].number // empty") \
            || CANAL_OUVERT=non

          if [ "$CANAL_OUVERT" = "oui" ] && [ -n "$EXISTANTE" ]; then
            echo "Issue #$EXISTANTE déjà ouverte — ajout d'un commentaire."
            gh issue comment "$EXISTANTE" --repo "$DEPOT" --body-file corps-nuit-rouge.md \
              || CANAL_OUVERT=non
          elif [ "$CANAL_OUVERT" = "oui" ]; then
            gh issue create --repo "$DEPOT" --title "$TITRE" --body-file corps-nuit-rouge.md \
              || CANAL_OUVERT=non
          fi

          if [ "$CANAL_OUVERT" != "oui" ]; then
            # LE CANAL EST CLOS, et ce job ROUGIT pour le dire. Le contenu est
            # sauf — il est dans le résumé ci-dessus —, mais une alarme qui ne
            # laisse aucune trace DURABLE dans le dépôt n'est pas une alarme :
            # la prochaine personne à regarder ne saura pas que cette nuit a
            # rougi. *Le geste est un réglage de dépôt, pas un correctif de
            # code* : Settings → General → Features → cocher « Issues ».
            {
              echo
              echo "> ⚠ **L'ISSUE N'A PAS PU ÊTRE OUVERTE.** Les *Issues* sont"
              echo "> désactivées sur ce dépôt, ou le jeton n'a pas le droit d'y"
              echo "> écrire. Le contenu ci-dessus est donc la SEULE trace de"
              echo "> cette alarme, et elle disparaîtra avec la rétention des"
              echo "> exécutions — alors qu'une issue, elle, attend qu'on la lise."
              echo ">"
              echo "> **Le geste :** Settings → General → Features → cocher **Issues**."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=alarme sans canal::Les Issues sont désactivées sur ce dépôt : l'alarme d'É12 ne peut rien ouvrir. Settings → General → Features → cocher « Issues »."
            exit 1
          fi

  # ── (b) LE BATTEMENT — la vérification nocturne tourne-t-elle ENCORE ? ──────
  #
  # Le DÉTECTIF de l'alarme elle-même, et il est indépendant d'elle dans les
  # deux sens. (a) dit qu'une nuit a rougi ; il est structurellement aveugle à
  # une planification qui s'ARRÊTE, puisqu'un flux qui ne tourne pas ne produit
  # aucun échec. Le silence a exactement la forme du succès.
  #
  # **Il ne tourne PAS sur `schedule`, et c'est tout son objet** : un contrôle
  # qui ne s'exécute que lorsque la planification s'exécute ne peut pas
  # constater qu'elle a cessé. Il s'accroche donc à l'activité HUMAINE, seul
  # déclencheur qu'une désactivation ne touche pas.
  #
  # Sa limite, dite plutôt que tue : si personne ne pousse rien, il ne tourne
  # pas davantage. Il ne garantit pas une détection en N heures — il garantit
  # qu'AU PREMIER RETOUR de quelqu'un, l'écran soit rouge.
  battement:
    name: battement — la nuit bat-elle encore ?
    # IL NE TOURNE PAS SUR LES PROPOSITIONS, et la raison ne tient plus au coût.
    #
    # Elle y tenait : ce job coûtait une minute pleine par exécution, et le
    # quota était serré. Le quota ne l'est plus — le dépôt est public depuis le
    # 12/09/2026. **Ce qui reste, et qui n'a jamais dépendu du quota** : une
    # proposition et sa fusion sont séparées de quelques minutes, si bien que
    # jouer le battement sur les deux mesure DEUX FOIS LE MÊME ÉTAT. La question
    # qu'il pose — *la vérification nocturne tourne-t-elle encore ?* — n'a pas
    # de réponse qui change en quelques minutes.
    #
    # **Ce qui ne bouge PAS, et qui est la raison d'être du job** (§9, 31/08) :
    # il ne tourne toujours PAS sur `schedule`. *Un contrôle qui ne s'exécute
    # que quand la planification s'exécute ne peut pas constater qu'elle a
    # cessé.* Il tourne sur l'activité HUMAINE, et une fusion en est une.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # UN BLOC `permissions:` N'EST PAS ADDITIF : il définit l'ENSEMBLE des
    # droits du jeton, et tout ce qui n'y figure pas tombe à `none`. La
    # première rédaction ne demandait que `actions: read` — `contents` est
    # donc passé à `none`, et `actions/checkout` a reçu « Repository not
    # found » (le dépôt était alors privé). Mesuré par contraste sur la même
    # exécution :
    # le job `verify`, qui ne déclare aucun bloc, a cloné sans difficulté.
    # Même famille que le `ON UPDATE CASCADE` de D49 — une valeur par défaut
    # qui répond à une question qu'on n'a pas posée.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: pnpm battement
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm battement
