name: DB migrate & seed

# Migration et amorçage de la base, déclenchés À LA MAIN uniquement.
#
# Le proxy sortant de l'environnement cloud ne relaie pas le TCP : la base
# PostgreSQL (Neon) est injoignable depuis une session Claude Code. On applique
# donc la migration et le seed depuis un exécuteur GitHub Actions.
#
# IMPÉRATIF (voir docs/decisions/2026-08-20-migration-par-github-actions.md) :
# aucun déclenchement automatique. Une migration ne doit jamais partir toute
# seule — ni sur push, ni sur pull_request, ni sur planification. Seul
# workflow_dispatch est autorisé. Ne PAS ajouter d'autre déclencheur ici.
on:
  workflow_dispatch:
    inputs:
      # Purge des données de démonstration avant le seed. Par défaut FALSE :
      # une exécution ordinaire du workflow n'efface jamais rien. Réservé à une
      # base ne contenant que des données de démonstration — voir
      # docs/decisions/2026-08-20-purge-des-donnees-de-demonstration.md, qui fixe
      # la condition de retrait de cette option dès qu'une donnée réelle existera.
      reinitialiser_demo:
        description: "Purger les données de démonstration AVANT le seed (base de démonstration UNIQUEMENT)"
        type: boolean
        default: false
        required: false

# Une seule migration à la fois : deux exécutions concurrentes attaqueraient la
# même base. On ne coupe pas celle en cours (cancel-in-progress: false) pour ne
# jamais interrompre une migration au milieu.
concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    name: migrate & seed
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # La connexion vient exclusivement des secrets : jamais de valeur en clair
      # dans le dépôt (I9).
      #
      # DEUX SECRETS, DEUX RÔLES, et aucun repli de l'un sur l'autre :
      #   — MIGRATION_DATABASE_URL porte le rôle PRIVILÉGIÉ. Les migrations, le
      #     seed et la purge en ont besoin : eux seuls font du DDL et écrivent le
      #     socle. Ce rôle contourne les politiques de cloisonnement par nature,
      #     c'est voulu, et c'est précisément pourquoi l'application ne doit
      #     jamais l'utiliser.
      #   — DATABASE_URL porte le rôle APPLICATIF `codiplan_app`, soumis aux
      #     politiques. Seule l'étape de contrôle du cloisonnement s'en sert ici.
      #
      # Le repli `MIGRATION_DATABASE_URL || DATABASE_URL` a été retiré : depuis
      # que DATABASE_URL porte le rôle applicatif, ce repli ferait tourner les
      # migrations sous un rôle sans droits DDL — et masquerait un secret
      # manquant derrière une erreur sans rapport.
      # Voir docs/decisions/2026-08-20-inventaire-et-controle-de-cloisonnement.md.
      DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Appliquer la migration
        run: pnpm prisma migrate deploy

      # Ne s'exécute QUE si l'entrée `reinitialiser_demo` a été cochée au
      # déclenchement : `inputs.reinitialiser_demo` vaut le booléen `false` par
      # défaut, la condition est donc fausse pour une exécution ordinaire. Le
      # script pose lui-même une seconde barrière et refuse de purger sans la
      # confirmation explicite ci-dessous. Placé APRÈS la migration : la purge
      # suppose le schéma courant.
      - name: Purger les données de démonstration
        if: ${{ inputs.reinitialiser_demo }}
        env:
          PURGE_DEMONSTRATION_CONFIRMEE: "oui"
        run: pnpm exec tsx scripts/purge-demonstration.mts

      - name: Exécuter le seed
        run: pnpm db:seed

      # ── Deux étapes, deux motifs d'échec distincts ────────────────────────
      # 1. L'INVENTAIRE dit ce que la base contient. Il compte à plat, sous une
      #    identité exemptée des politiques, et échoue s'il ne peut pas l'être :
      #    un décompte filtré serait faux, et un inventaire faux est pire qu'un
      #    inventaire absent.
      # 2. Le CONTRÔLE DE CLOISONNEMENT dit ce que le rôle applicatif voit. Il
      #    tourne sous DATABASE_URL — le rôle `codiplan_app`, soumis aux
      #    politiques — et se confronte à l'inventaire.
      # Confondre les deux, comme le faisait le décompte unique qu'elles
      # remplacent, revient à mesurer les politiques à travers elles-mêmes.

      - name: Inventaire à plat
        run: pnpm exec tsx scripts/inventaire.mts

      # Exécutée avec l'URL APPLICATIVE, jamais celle des migrations : le rôle
      # de migration contourne les politiques, un contrôle joué sous lui ne
      # prouverait rien. Le script refuse d'ailleurs de démarrer si les deux URL
      # coïncident, ou si le rôle connecté échappe aux politiques.
      #
      # C'est l'angle mort que les tests d'isolation ne couvrent pas : ils
      # éprouvent un PostgreSQL local jetable, donc les migrations écrites — pas
      # la base hébergée, ni le rôle réellement déposé dans la configuration du
      # service.
      - name: Contrôle de cloisonnement (base hébergée, rôle applicatif)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: pnpm exec tsx scripts/controle-cloisonnement.mts
