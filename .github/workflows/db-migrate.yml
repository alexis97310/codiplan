name: DB migrate & seed

# Migration et amorçage de la base.
#
# Le proxy sortant de l'environnement cloud ne relaie pas le TCP : la base
# PostgreSQL (Neon) est injoignable depuis une session Claude Code. On applique
# donc la migration et le seed depuis un exécuteur GitHub Actions.
#
# ── LE DÉCLENCHEMENT AUTOMATIQUE, ET LES QUATRE BORNES QUI L'AUTORISENT ──────
#
# ~~IMPÉRATIF : aucun déclenchement automatique. Une migration ne doit jamais
# partir toute seule — ni sur push, ni sur pull_request, ni sur planification.
# Seul workflow_dispatch est autorisé. Ne PAS ajouter d'autre déclencheur ici.~~
#
# AMENDÉ LE 12/09/2026 (D116, amendement du §12 du protocole de session). La
# phrase est BARRÉE ET NON EFFACÉE : elle a gouverné ce fichier trois semaines,
# et ce qui a été décidé un jour se relit.
#
# Ce qu'elle protégeait était le risque de PERTE, et il demeure. Ce qu'elle
# produisait en fait était une asymétrie : le code se déployait seul, la
# migration attendait une main — et elle attendait EN SILENCE. Mesuré le
# 12/09/2026 : quatre migrations fusionnées entre 21 h 55 et 22 h 27, quatre
# fois le code déployé et la base en arrière, /planning tombé, et la réparation
# passée par une purge destructrice qui a effacé les comptes.
#
# QUATRE BORNES, et aucune n'est négociable. Chacune est tenue par une pièce de
# ce fichier et par un gardien de tests/unit/ci/migration-automatique.test.ts :
#   1. cible « demonstration » UNIQUEMENT — la production n'est JAMAIS atteinte
#      par une exécution automatique, sous aucune condition ;
#   2. la purge n'est JAMAIS automatique — elle reste un geste de main ;
#   3. l'exécution automatique REFUSE si la base porte une donnée hors seed ;
#   4. elle ne se déclenche que si `prisma/migrations/` a changé.
#
# Et elle DIT ce qu'elle a fait : la liste des migrations appliquées entre au
# résumé d'exécution. *Une automatisation muette ne peut pas être auditée.*
on:
  # BORNE 4. `paths` restreint au répertoire des migrations : un commit qui ne
  # touche que du code ne réveille pas la base. Le seed, lui, n'est PAS dans
  # cette liste — `prisma/seed.ts` change des données de démonstration, et D116
  # n'automatise que ce qui casse la production quand il manque : le SCHÉMA.
  push:
    branches: [main]
    paths:
      - "prisma/migrations/**"
  workflow_dispatch:
    inputs:
      # DEUX BASES, DEUX JEUX DE SECRETS, ET AUCUN REPLI DE L'UNE SUR L'AUTRE.
      #
      # La base que les secrets historiques désignent est celle de
      # DÉMONSTRATION : c'est elle que le seed peuple de deux sociétés fictives,
      # c'est elle que la veille nocturne observe. La PRODUCTION est une base
      # NEUVE, avec ses propres secrets — et sur elle, le seed NE S'EXÉCUTE
      # JAMAIS : « les données de démonstration ne s'installent pas en
      # production » n'est pas une recommandation de la note de mise en ligne,
      # c'est ce que cette entrée rend vrai.
      #
      # Le choix est EXPLICITE et sans défaut silencieux : la valeur par défaut
      # est la démonstration, c'est-à-dire le cas où une erreur ne coûte rien.
      cible:
        description: "Quelle base ? La production n'est JAMAIS amorcée par le seed."
        type: choice
        required: true
        default: demonstration
        options:
          - demonstration
          - production
      # Purge des données de démonstration avant le seed. Par défaut FALSE :
      # une exécution ordinaire du workflow n'efface jamais rien. Réservé à une
      # base ne contenant que des données de démonstration — voir
      # docs/decisions/2026-08-20-purge-des-donnees-de-demonstration.md, qui fixe
      # la condition de retrait de cette option dès qu'une donnée réelle existera.
      reinitialiser_demo:
        description: "Purger les données de démonstration AVANT le seed (base de démonstration UNIQUEMENT)"
        type: boolean
        default: false
        required: false

# Une seule migration à la fois : deux exécutions concurrentes attaqueraient la
# même base. On ne coupe pas celle en cours (cancel-in-progress: false) pour ne
# jamais interrompre une migration au milieu.
concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    name: migrate & seed
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # La connexion vient exclusivement des secrets : jamais de valeur en clair
      # dans le dépôt (I9).
      #
      # DEUX SECRETS, DEUX RÔLES, et aucun repli de l'un sur l'autre :
      #   — MIGRATION_DATABASE_URL porte le rôle PRIVILÉGIÉ. Les migrations, le
      #     seed et la purge en ont besoin : eux seuls font du DDL et écrivent le
      #     socle. Ce rôle contourne les politiques de cloisonnement par nature,
      #     c'est voulu, et c'est précisément pourquoi l'application ne doit
      #     jamais l'utiliser.
      #   — DATABASE_URL porte le rôle APPLICATIF `codiplan_app`, soumis aux
      #     politiques. Seule l'étape de contrôle du cloisonnement s'en sert ici.
      #
      # Le repli `MIGRATION_DATABASE_URL || DATABASE_URL` a été retiré : depuis
      # que DATABASE_URL porte le rôle applicatif, ce repli ferait tourner les
      # migrations sous un rôle sans droits DDL — et masquerait un secret
      # manquant derrière une erreur sans rapport.
      # Voir docs/decisions/2026-08-20-inventaire-et-controle-de-cloisonnement.md.
      # Les QUATRE secrets sont exposés bruts ; c'est l'étape suivante qui
      # choisit, parce qu'une expression ne sait pas distinguer « absent » de
      # « autre chose » — voir sa note.
      SECRET_MIGRATION_DEMONSTRATION: ${{ secrets.MIGRATION_DATABASE_URL }}
      SECRET_MIGRATION_PRODUCTION: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}
      SECRET_APPLICATIF_DEMONSTRATION: ${{ secrets.DATABASE_URL }}
      SECRET_APPLICATIF_PRODUCTION: ${{ secrets.PRODUCTION_DATABASE_URL }}
    steps:
      # ── LE CHOIX DE LA BASE, ET POURQUOI IL N'EST PAS UNE EXPRESSION ──────
      #
      # L'idiome `inputs.cible == 'production' && secrets.PRODUCTION_… ||
      # secrets.…` a l'air d'un ternaire. Il N'EN EST PAS UN quand la première
      # valeur est VIDE : `&&` rend alors la chaîne vide, `||` rend la seconde,
      # et un secret de production absent ferait migrer LA DÉMONSTRATION en
      # croyant migrer la production — silencieusement, puisque la variable
      # n'est pas vide. *C'est le repli que le gardien de l'inventaire refuse
      # depuis le 20/08, retrouvé sous un autre costume, et c'est lui qui l'a
      # attrapé.*
      #
      # Le choix se fait donc ICI, dans un shell, où « absent » se distingue de
      # « autre chose », et où l'absence ARRÊTE.
      # ── BORNE 1 : LA CIBLE D'UNE EXÉCUTION AUTOMATIQUE EST ÉCRITE, JAMAIS
      #    HÉRITÉE D'UNE VALEUR VIDE ──────────────────────────────────────────
      #
      # Sur un `push`, `inputs.cible` n'existe pas et vaut la chaîne vide. Le
      # `else` ci-dessous choisirait donc la démonstration — LE BON RÉSULTAT PAR
      # LE MAUVAIS CHEMIN. C'est exactement la faute du 09/09 : une garantie qui
      # tient à ce qu'une valeur soit vide cesse le jour où elle ne l'est plus,
      # et rien ne le dit. La cible est donc CALCULÉE et NOMMÉE, et le refus de
      # la production sur ce chemin est une instruction, pas une conséquence.
      - name: Décider de la cible, et refuser la production hors d'une main
        id: cible
        env:
          CIBLE_DEMANDEE: ${{ inputs.cible }}
          EVENEMENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENEMENT" = "workflow_dispatch" ]; then
            cible="$CIBLE_DEMANDEE"
            automatique=non
          else
            # BORNE 1. Aucune condition, aucune entrée, aucune dérogation : une
            # exécution que personne n'a déclenchée ne vise QUE la démonstration.
            cible=demonstration
            automatique=oui
          fi
          if [ "$automatique" = "oui" ] && [ "$cible" != "demonstration" ]; then
            echo "::error::BORNE 1 — une exécution automatique ne vise que « demonstration ». Cible calculée : $cible. Refus."
            exit 1
          fi
          echo "cible=$cible" >> "$GITHUB_OUTPUT"
          echo "automatique=$automatique" >> "$GITHUB_OUTPUT"
          echo "CIBLE_RETENUE=$cible" >> "$GITHUB_ENV"
          echo "Cible retenue : $cible (déclenchement ${EVENEMENT}, automatique=$automatique)" >> "$GITHUB_STEP_SUMMARY"

      - name: Choisir la base, et refuser plutôt que se rabattre
        env:
          CIBLE: ${{ steps.cible.outputs.cible }}
        run: |
          set -euo pipefail
          if [ "$CIBLE" = "production" ]; then
            migration="$SECRET_MIGRATION_PRODUCTION"
            applicatif="$SECRET_APPLICATIF_PRODUCTION"
            prefixe="PRODUCTION_"
          else
            migration="$SECRET_MIGRATION_DEMONSTRATION"
            applicatif="$SECRET_APPLICATIF_DEMONSTRATION"
            prefixe=""
          fi
          if [ -z "$migration" ]; then
            echo "::error::Le secret ${prefixe}MIGRATION_DATABASE_URL n'existe pas. Aucun repli n'est prévu : déposez-le, ou changez de cible."
            exit 1
          fi
          if [ -z "$applicatif" ]; then
            echo "::error::Le secret ${prefixe}DATABASE_URL n'existe pas. Le contrôle de cloisonnement en a besoin : il se joue sous le rôle applicatif, jamais sous celui des migrations."
            exit 1
          fi
          echo "DATABASE_URL=$migration" >> "$GITHUB_ENV"
          echo "URL_APPLICATIVE=$applicatif" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      # ── BORNE 3 : L'EXÉCUTION AUTOMATIQUE REFUSE UNE BASE QUI N'EST PLUS
      #    UNE FICTION ────────────────────────────────────────────────────────
      #
      # AVANT la migration, jamais après : une fois le schéma changé, refuser ne
      # sert plus à rien. Le script lit les sociétés sous une identité EXEMPTÉE
      # des politiques — sans quoi `FORCE ROW LEVEL SECURITY` lui ferait voir
      # zéro ligne et conclure « aucune société étrangère », c'est-à-dire OUVRIR
      # sur une base pleine de données réelles (§9, 07/09).
      #
      # Il ne tourne PAS sur le chemin manuel : une main qui déclenche a regardé,
      # et c'est précisément l'issue que ce refus propose quand il se prononce.
      - name: Refuser si la base porte une donnée hors seed (automatique seul)
        if: ${{ steps.cible.outputs.automatique == 'oui' }}
        run: pnpm exec tsx scripts/refus-si-donnees-reelles.mts

      # ── CE QUE LA BASE PORTAIT AVANT, pour que « ce qui a été appliqué » soit
      #    une DIFFÉRENCE et non une liste recopiée du dépôt ──────────────────
      #
      # Le résumé doit nommer les migrations que CETTE exécution a posées, pas
      # celles que le répertoire contient : les deux coïncident la première fois
      # et divergent ensuite. *Une ligne qui ne peut pas bouger sous une faute
      # n'est pas une observation* (§9, 06/09) — d'où une lecture AVANT et une
      # APRÈS, et la soustraction entre les deux.
      - name: Lire les migrations déjà appliquées (avant)
        id: avant
        run: |
          set -euo pipefail
          pnpm exec tsx scripts/migrations-appliquees.mts > /tmp/migrations-avant.txt
          echo "Lues avant migration : $(wc -l < /tmp/migrations-avant.txt)"

      - name: Appliquer la migration
        run: pnpm prisma migrate deploy

      # UNE AUTOMATISATION MUETTE NE PEUT PAS ÊTRE AUDITÉE. Le résumé porte le
      # nom de chaque migration posée, et « aucune » est un résultat ÉCRIT — pas
      # un silence : une exécution qui n'a rien appliqué parce que la base était
      # déjà à jour et une exécution qui n'a rien appliqué parce qu'elle a échoué
      # ne se corrigent pas au même endroit.
      - name: Dire ce qui a été appliqué
        if: always()
        run: |
          set -euo pipefail
          pnpm exec tsx scripts/migrations-appliquees.mts > /tmp/migrations-apres.txt || true
          {
            echo "### Migrations appliquées par cette exécution"
            echo
            posees="$(comm -13 /tmp/migrations-avant.txt /tmp/migrations-apres.txt || true)"
            if [ -z "$posees" ]; then
              echo "**Aucune.** La base portait déjà tout ce que le dépôt attend."
            else
              echo "$posees" | sed 's/^/- `/;s/$/`/'
            fi
            echo
            echo "État final : $(wc -l < /tmp/migrations-apres.txt) migration(s) appliquée(s) en base."
          } >> "$GITHUB_STEP_SUMMARY"

      # Ne s'exécute QUE si l'entrée `reinitialiser_demo` a été cochée au
      # déclenchement : `inputs.reinitialiser_demo` vaut le booléen `false` par
      # défaut, la condition est donc fausse pour une exécution ordinaire. Le
      # script pose lui-même une seconde barrière et refuse de purger sans la
      # confirmation explicite ci-dessous. Placé APRÈS la migration : la purge
      # suppose le schéma courant.
      #
      # BORNE 2 — `github.event_name == 'workflow_dispatch'` : la purge ne part
      # JAMAIS toute seule. Elle vide toutes les sociétés sans condition, et
      # c'est elle qui a effacé les comptes le 12/09/2026 au soir. Elle reste un
      # geste de main, avec son avertissement. La condition est écrite EN PLUS
      # de `inputs.reinitialiser_demo` — qui vaut déjà faux sur un push — parce
      # qu'une garantie qui tient à ce qu'une entrée soit absente est une
      # garantie qui tient à une valeur vide, et c'est la faute du 09/09.
      - name: Purger les données de démonstration
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.reinitialiser_demo && steps.cible.outputs.cible != 'production' }}
        env:
          PURGE_DEMONSTRATION_CONFIRMEE: "oui"
        run: pnpm exec tsx scripts/purge-demonstration.mts

      # SAUTÉE EN PRODUCTION, et c'est le cœur de l'entrée « cible ». Le seed
      # crée deux sociétés fictives ; sur une base réelle, il n'a rien à faire.
      # Un gardien statique vérifie que cette condition ne disparaît pas
      # (tests/unit/ci/cible-de-migration.test.ts).
      - name: Exécuter le seed (démonstration UNIQUEMENT)
        if: ${{ steps.cible.outputs.cible != 'production' }}
        run: pnpm db:seed

      # ── Deux étapes, deux motifs d'échec distincts ────────────────────────
      # 1. L'INVENTAIRE dit ce que la base contient. Il compte à plat, sous une
      #    identité exemptée des politiques, et échoue s'il ne peut pas l'être :
      #    un décompte filtré serait faux, et un inventaire faux est pire qu'un
      #    inventaire absent.
      # 2. Le CONTRÔLE DE CLOISONNEMENT dit ce que le rôle applicatif voit. Il
      #    tourne sous DATABASE_URL — le rôle `codiplan_app`, soumis aux
      #    politiques — et se confronte à l'inventaire.
      # Confondre les deux, comme le faisait le décompte unique qu'elles
      # remplacent, revient à mesurer les politiques à travers elles-mêmes.

      - name: Inventaire à plat
        run: pnpm exec tsx scripts/inventaire.mts

      # Exécutée avec l'URL APPLICATIVE, jamais celle des migrations : le rôle
      # de migration contourne les politiques, un contrôle joué sous lui ne
      # prouverait rien. Le script refuse d'ailleurs de démarrer si les deux URL
      # coïncident, ou si le rôle connecté échappe aux politiques.
      #
      # C'est l'angle mort que les tests d'isolation ne couvrent pas : ils
      # éprouvent un PostgreSQL local jetable, donc les migrations écrites — pas
      # la base hébergée, ni le rôle réellement déposé dans la configuration du
      # service.
      - name: Contrôle de cloisonnement (base hébergée, rôle applicatif)
        env:
          DATABASE_URL: ${{ env.URL_APPLICATIVE }}
          MIGRATION_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: pnpm exec tsx scripts/controle-cloisonnement.mts
