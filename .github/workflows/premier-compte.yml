name: Ouvrir le PREMIER compte

# LE GESTE 7 DE LA NOTE DE MISE EN LIGNE, DEPUIS UN NAVIGATEUR.
#
# La note se veut suivable depuis un téléphone. Sept gestes sur huit le sont ;
# celui-ci exigeait un terminal, donc un ordinateur, donc quelqu'un d'autre. Ce
# flux le rend cliquable — et il ne change RIEN à ce que le script fait : c'est
# le même `scripts/amorcage-premier-compte.mts`, avec le même cliquet en base
# (D65), la même URL imprimée UNE SEULE FOIS, et le même refus dès que la
# société porte une habilitation.
#
# ── CE QUE CE FLUX COÛTE, ET IL EST ÉCRIT PLUTÔT QUE TU ─────────────────────
# L'URL de premier accès porte un jeton à usage unique, valable UNE HEURE. Jouée
# ici, elle entre dans le JOURNAL D'EXÉCUTION du flux : elle est donc lisible,
# pendant cette heure, par quiconque a accès en lecture à ce dépôt. C'est le
# prix du geste depuis un navigateur, et il n'est acceptable qu'à deux
# conditions, toutes deux vérifiables :
#   1. le dépôt est PRIVÉ (⚠️ voir « Avant de rendre ce dépôt public » au README) ;
#   2. l'URL est suivie DANS L'HEURE, et le mot de passe choisi tout de suite —
#      un jeton consommé n'ouvre plus rien.
# Si l'une des deux n'est pas tenue, jouer le script depuis un poste : le
# journal n'existe alors pas. Et si le jeton expire avant d'être suivi,
# `reemettre` en rend un autre TANT QUE personne n'a choisi de mot de passe.
#
# IMPÉRATIF, comme pour db-migrate.yml : aucun déclenchement automatique. Un
# geste qui ouvre une identité ne part jamais tout seul.
on:
  workflow_dispatch:
    inputs:
      # Le premier compte s'ouvre sur la base qui reçoit la PRODUCTION, pas sur
      # celle de démonstration — mais l'entrée existe pour les deux, parce qu'on
      # répète le geste sur la démonstration avant de le jouer pour de bon.
      cible:
        description: "Quelle base ?"
        type: choice
        required: true
        default: production
        options:
          - production
          - demonstration
      confirmation:
        description: "Taper « oui » pour confirmer — seconde barrière, comme la purge"
        type: string
        required: true
        default: "non"
      societe:
        description: "Identifiant de la société (uuid) — le flux « DB migrate & seed » le nomme dans son inventaire"
        type: string
        required: true
      email:
        description: "Adresse de la personne à qui l'accès est délivré"
        type: string
        required: true
      nom:
        description: "Nom de cette personne (ignoré en réémission)"
        type: string
        required: false
        default: ""
      role:
        description: "Rôle du premier compte"
        type: choice
        required: true
        default: admin_societe
        options:
          - admin_societe
          - admin_plateforme
      base:
        description: "URL publique de l'application, sans barre finale (ex. https://codiplan.example.com)"
        type: string
        required: true
      reemettre:
        description: "Réémettre le jeton d'une identité qui n'a JAMAIS servi (aucun mot de passe choisi)"
        type: boolean
        required: false
        default: false

# Deux exécutions concurrentes viseraient la même société, et la seconde serait
# refusée par le cliquet — ce qui est correct mais illisible. On sérialise.
concurrency:
  group: premier-compte
  cancel-in-progress: false

jobs:
  ouvrir:
    name: ouvrir le premier compte
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Le rôle PRIVILÉGIÉ, comme pour les migrations : le script écrit une
      # identité et une habilitation avant qu'aucune société ne soit active.
      # DATABASE_URL (rôle applicatif) ne le pourrait pas, et c'est voulu.
      # Bruts : c'est l'étape de choix qui tranche. Une expression
      # `cible == 'production' && secrets.PRODUCTION_… || secrets.…` retombe
      # SILENCIEUSEMENT sur la démonstration quand le secret de production est
      # vide — mesuré en écrivant ce flux, et attrapé par le gardien de
      # l'inventaire, qui refuse tout repli entre les deux secrets.
      SECRET_MIGRATION_DEMONSTRATION: ${{ secrets.MIGRATION_DATABASE_URL }}
      SECRET_MIGRATION_PRODUCTION: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}
    steps:
      - name: Refuser sans confirmation explicite
        if: ${{ inputs.confirmation != 'oui' }}
        run: |
          echo "::error::Le champ « confirmation » doit valoir exactement « oui »."
          exit 1

      - name: Choisir la base, et refuser plutôt que se rabattre
        env:
          CIBLE: ${{ inputs.cible }}
        run: |
          set -euo pipefail
          if [ "$CIBLE" = "production" ]; then
            migration="$SECRET_MIGRATION_PRODUCTION"
            prefixe="PRODUCTION_"
          else
            migration="$SECRET_MIGRATION_DEMONSTRATION"
            prefixe=""
          fi
          if [ -z "$migration" ]; then
            echo "::error::Le secret ${prefixe}MIGRATION_DATABASE_URL n'existe pas. Aucun repli n'est prévu : déposez-le, ou changez de cible."
            exit 1
          fi
          echo "DATABASE_URL=$migration" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      # Le script porte lui-même sa barrière (la variable de confirmation) et
      # son cliquet (il refuse dès qu'une habilitation existe). Ce flux ne les
      # contourne pas : il les APPELLE.
      - name: Ouvrir la première identité
        env:
          AMORCAGE_PREMIER_COMPTE_CONFIRME: "oui"
          SOCIETE: ${{ inputs.societe }}
          EMAIL: ${{ inputs.email }}
          NOM: ${{ inputs.nom }}
          ROLE: ${{ inputs.role }}
          BASE: ${{ inputs.base }}
          REEMETTRE: ${{ inputs.reemettre }}
        run: |
          set -euo pipefail
          if [ "$REEMETTRE" = "true" ]; then
            pnpm exec tsx scripts/amorcage-premier-compte.mts \
              --reemettre --societe "$SOCIETE" --email "$EMAIL" --base "$BASE" \
              | tee /tmp/amorcage.txt
          else
            pnpm exec tsx scripts/amorcage-premier-compte.mts \
              --societe "$SOCIETE" --email "$EMAIL" --nom "$NOM" \
              --role "$ROLE" --base "$BASE" \
              | tee /tmp/amorcage.txt
          fi

      # Le résumé d'exécution est plus facile à lire depuis un téléphone que le
      # journal brut. Il a EXACTEMENT la même visibilité que lui : ce n'est pas
      # une protection, c'est un confort, et le dire évite qu'on le prenne pour
      # l'autre.
      - name: Reporter la sortie dans le résumé
        if: always()
        run: |
          {
            echo "## Ouverture du premier compte"
            echo
            echo "L'URL ci-dessous porte un jeton **à usage unique**, valable **une heure**."
            echo "Elle est lisible par quiconque a accès en lecture à ce dépôt."
            echo "Suivez-la maintenant, choisissez un mot de passe, activez le second facteur."
            echo
            echo '```'
            cat /tmp/amorcage.txt 2>/dev/null || echo "(aucune sortie : le geste a été refusé, voir le journal)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
