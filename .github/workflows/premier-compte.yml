name: Ouvrir le PREMIER compte

# LE GESTE 7 DE LA NOTE DE MISE EN LIGNE, DEPUIS UN NAVIGATEUR.
#
# La note se veut suivable depuis un téléphone. Sept gestes sur huit le sont ;
# celui-ci exigeait un terminal, donc un ordinateur, donc quelqu'un d'autre. Ce
# flux le rend cliquable — et il ne change RIEN à ce que le script fait : c'est
# le même `scripts/amorcage-premier-compte.mts`, avec le même cliquet en base
# (D65), la même URL imprimée UNE SEULE FOIS, et le même refus dès que la
# société porte une habilitation.
#
# ── CE FLUX N'IMPRIME PLUS L'URL, ET LA RAISON EST DATÉE (12/09/2026) ───────
# Il l'imprimait, et il le DISAIT : « elle entre dans le journal d'exécution,
# lisible par quiconque a accès en lecture à ce dépôt ». La condition qui
# rendait cela acceptable était « le dépôt est PRIVÉ ». Or cette condition
# tient à un ATTRIBUT DU DÉPÔT, qui change d'un clic — et le jour où il change,
# GitHub ne republie pas seulement l'avenir : IL PUBLIE AUSSI LE PASSÉ. Les
# journaux déjà écrits deviennent lisibles, avec leur jeton dedans.
#
# Une garantie conditionnée à un attribut qu'un clic modifie n'est pas une
# garantie : c'est un pari sur l'ordre des gestes. Le flux fait donc désormais
# le travail privilégié — ouvrir l'identité, ou réémettre — SANS JAMAIS RENDRE
# L'URL : elle est retirée de ce qui est imprimé, et masquée par surcroît.
#
# Le lien se récupère depuis un poste, par `--reemettre`, dont la sortie ne
# vit dans aucun journal. Le cliquet de D65 tient cette voie ouverte tant que
# PERSONNE n'a choisi de mot de passe, et la ferme pour toujours ensuite.
#
# Ce que cela COÛTAIT, écrit plutôt que tu : le geste n'était plus entièrement
# suivable depuis un téléphone. La moitié privilégiée l'était ; la délivrance
# du lien demandait un terminal.
#
# ── LE CANAL PRIVÉ EXISTE DEPUIS LE 13/09/2026 (Q8) ─────────────────────────
# Le paragraphe ci-dessus annonçait qu'un envoi par courriel « n'est ni câblé
# ni doté d'un secret », et l'un et l'autre sont faits : `--envoyer` poste le
# lien, `COURRIEL_API_CLE` et `COURRIEL_EXPEDITEUR` le configurent. La phrase
# est mise au passé plutôt qu'effacée — elle a gouverné ce flux deux jours.
#
# Et l'entrée `destinataire` achève le chemin le MÊME jour : sans elle, le lien
# partait à l'adresse de l'IDENTITÉ, qui sur la démonstration est en
# `.test` — donc dans le vide.
#
# IMPÉRATIF, comme pour db-migrate.yml : aucun déclenchement automatique. Un
# geste qui ouvre une identité ne part jamais tout seul.
on:
  workflow_dispatch:
    inputs:
      # Le premier compte s'ouvre sur la base qui reçoit la PRODUCTION, pas sur
      # celle de démonstration — mais l'entrée existe pour les deux, parce qu'on
      # répète le geste sur la démonstration avant de le jouer pour de bon.
      cible:
        description: "Quelle base ?"
        type: choice
        required: true
        default: production
        options:
          - production
          - demonstration
      confirmation:
        description: "Taper « oui » pour confirmer — seconde barrière, comme la purge"
        type: string
        required: true
        default: "non"
      societe:
        description: "Identifiant de la société (uuid) — le flux « DB migrate & seed » le nomme dans son inventaire"
        type: string
        required: true
      email:
        description: "Adresse qui DÉSIGNE l'identité (la base la cherche par là) — pas forcément la boîte qui reçoit : voir « destinataire »"
        type: string
        required: true
      nom:
        description: "Nom de cette personne (ignoré en réémission)"
        type: string
        required: false
        default: ""
      role:
        description: "Rôle du premier compte"
        type: choice
        required: true
        default: admin_societe
        options:
          - admin_societe
          - admin_plateforme
      base:
        description: "URL publique de l'application, sans barre finale (ex. https://codiplan.example.com)"
        type: string
        required: true
      envoyer:
        description: "Envoyer le lien par courriel (exige les secrets COURRIEL_API_CLE et COURRIEL_EXPEDITEUR)"
        type: boolean
        required: false
        default: false
      # LE DESTINATAIRE N'EST PLUS L'IDENTITÉ (13/09/2026). « email » DÉSIGNE
      # l'identité que la base cherche ; sur la démonstration, les neuf
      # identités semées portent des adresses en @codima.test, un domaine
      # réservé par la RFC 2606 qui ne résout nulle part. Sans cette entrée, le
      # lien part dans le vide. Vide, elle vaut « email » : rien ne change pour
      # qui ne la renseigne pas.
      #
      # ELLE EST PUBLIQUE, ET ON LE DIT PLUTÔT QUE DE FAIRE SEMBLANT. GitHub
      # affiche les entrées d'un workflow_dispatch dans le récapitulatif de
      # l'exécution, et ce dépôt est public : masquer l'adresse dans le journal
      # serait une protection décorative — visible d'un panneau à l'autre.
      destinataire:
        description: "Boîte qui REÇOIT le lien, si elle diffère de « email » — publiquement visible, comme toute entrée de ce flux"
        type: string
        required: false
        default: ""
      reemettre:
        description: "Réémettre le jeton d'une identité qui n'a JAMAIS servi (aucun mot de passe choisi)"
        type: boolean
        required: false
        default: false

# Deux exécutions concurrentes viseraient la même société, et la seconde serait
# refusée par le cliquet — ce qui est correct mais illisible. On sérialise.
concurrency:
  group: premier-compte
  cancel-in-progress: false

jobs:
  ouvrir:
    name: ouvrir le premier compte
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Le rôle PRIVILÉGIÉ, comme pour les migrations : le script écrit une
      # identité et une habilitation avant qu'aucune société ne soit active.
      # DATABASE_URL (rôle applicatif) ne le pourrait pas, et c'est voulu.
      # Bruts : c'est l'étape de choix qui tranche. Une expression
      # `cible == 'production' && secrets.PRODUCTION_… || secrets.…` retombe
      # SILENCIEUSEMENT sur la démonstration quand le secret de production est
      # vide — mesuré en écrivant ce flux, et attrapé par le gardien de
      # l'inventaire, qui refuse tout repli entre les deux secrets.
      SECRET_MIGRATION_DEMONSTRATION: ${{ secrets.MIGRATION_DATABASE_URL }}
      SECRET_MIGRATION_PRODUCTION: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}
    steps:
      - name: Refuser sans confirmation explicite
        if: ${{ inputs.confirmation != 'oui' }}
        run: |
          echo "::error::Le champ « confirmation » doit valoir exactement « oui »."
          exit 1

      - name: Choisir la base, et refuser plutôt que se rabattre
        env:
          CIBLE: ${{ inputs.cible }}
        run: |
          set -euo pipefail
          if [ "$CIBLE" = "production" ]; then
            migration="$SECRET_MIGRATION_PRODUCTION"
            prefixe="PRODUCTION_"
          else
            migration="$SECRET_MIGRATION_DEMONSTRATION"
            prefixe=""
          fi
          if [ -z "$migration" ]; then
            echo "::error::Le secret ${prefixe}MIGRATION_DATABASE_URL n'existe pas. Aucun repli n'est prévu : déposez-le, ou changez de cible."
            exit 1
          fi
          echo "DATABASE_URL=$migration" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      # Le script porte lui-même sa barrière (la variable de confirmation) et
      # son cliquet (il refuse dès qu'une habilitation existe). Ce flux ne les
      # contourne pas : il les APPELLE.
      - name: Ouvrir la première identité
        env:
          AMORCAGE_PREMIER_COMPTE_CONFIRME: "oui"
          SOCIETE: ${{ inputs.societe }}
          EMAIL: ${{ inputs.email }}
          NOM: ${{ inputs.nom }}
          ROLE: ${{ inputs.role }}
          BASE: ${{ inputs.base }}
          REEMETTRE: ${{ inputs.reemettre }}
          ENVOYER: ${{ inputs.envoyer }}
          DESTINATAIRE: ${{ inputs.destinataire }}
          # LE CANAL QUI MANQUAIT (Q8, 13/09/2026). Le journal et le résumé
          # EXPURGENT l'URL — c'est la réparation du 12/09 —, si bien que le
          # lien ne sortait plus d'ici du tout : il fallait un terminal, donc un
          # ordinateur, donc quelqu'un d'autre. Avec ces deux secrets, il part
          # par courriel ; sans eux, l'envoi ÉCHOUE EN LE DISANT, et le geste
          # reste ce qu'il était.
          COURRIEL_API_CLE: ${{ secrets.COURRIEL_API_CLE }}
          COURRIEL_EXPEDITEUR: ${{ secrets.COURRIEL_EXPEDITEUR }}
        run: |
          set -uo pipefail
          # UN TABLEAU, PAS UNE CHAÎNE. Une chaîne se fait redécouper par le
          # shell : une adresse portant une espace — c'est une faute de frappe,
          # donc c'est le cas à attraper — arriverait TRONQUÉE au script, qui
          # écrirait à `foo@` sans que rien ne le dise.
          options=()
          if [ "$ENVOYER" = "true" ]; then
            options+=(--envoyer)
          fi
          # Le drapeau n'est passé QUE s'il est renseigné. Une entrée
          # facultative non remplie arrive VIDE, jamais absente : passer
          # `--destinataire ""` ferait écrire à personne. Le script retombe de
          # lui-même sur l'identité, mais on ne lui demande pas un travail que
          # l'appelant sait faire.
          if [ -n "$DESTINATAIRE" ]; then
            options+=(--destinataire "$DESTINATAIRE")
          fi
          # LA SORTIE NE VA PAS AU JOURNAL : elle va dans un fichier, et c'est
          # une version EXPURGÉE qui est rendue. Un `tee` rendait l'URL au
          # moment même où elle était produite — trop tard pour la masquer.
          code=0
          if [ "$REEMETTRE" = "true" ]; then
            pnpm exec tsx scripts/amorcage-premier-compte.mts \
              --reemettre --societe "$SOCIETE" --email "$EMAIL" --base "$BASE" \
              "${options[@]}" \
              > /tmp/amorcage.txt 2>&1 || code=$?
          else
            pnpm exec tsx scripts/amorcage-premier-compte.mts \
              --societe "$SOCIETE" --email "$EMAIL" --nom "$NOM" \
              --role "$ROLE" --base "$BASE" "${options[@]}" \
              > /tmp/amorcage.txt 2>&1 || code=$?
          fi

          # PREMIÈRE BARRIÈRE — le masque. Il est posé AVANT que quoi que ce
          # soit soit rendu : `::add-mask::` ne vaut que pour la suite du
          # journal, jamais pour ce qui est déjà écrit.
          grep -oE 'https?://[^[:space:]]+' /tmp/amorcage.txt > /tmp/urls.txt || true
          while IFS= read -r url; do
            [ -n "$url" ] || continue
            echo "::add-mask::$url"
            jeton=${url##*/}
            jeton=${jeton%%\?*}
            [ -n "$jeton" ] && echo "::add-mask::$jeton"
          done < /tmp/urls.txt

          # SECONDE BARRIÈRE — le retrait. C'est elle qui garde vraiment : un
          # masque dépend d'une reconnaissance de chaîne, et il ne survivrait
          # pas à un découpage de l'URL sur deux lignes. Les deux ne se
          # recouvrent pas, et aucune ne remplace l'autre.
          sed -E 's#https?://[^[:space:]]+#(URL RETIRÉE DU JOURNAL — voir le résumé)#g' \
            /tmp/amorcage.txt > /tmp/amorcage-expurge.txt
          cat /tmp/amorcage-expurge.txt
          exit $code

      # Le résumé a EXACTEMENT la même visibilité que le journal : ce n'est pas
      # une protection, c'est un confort. Il reçoit donc la version EXPURGÉE,
      # jamais la brute — la distinction est tout l'objet du 12/09/2026.
      - name: Reporter la sortie EXPURGÉE dans le résumé
        if: always()
        run: |
          {
            echo "## Ouverture du premier compte"
            echo
            echo "**L'URL de premier accès n'est PAS imprimée ici.** Le journal et ce"
            echo "résumé sont lisibles par quiconque peut lire le dépôt, et ils le"
            echo "restent après coup : un dépôt rendu public publie aussi son passé."
            echo
            echo '```'
            cat /tmp/amorcage-expurge.txt 2>/dev/null || echo "(aucune sortie : le geste a été refusé, voir le journal)"
            echo '```'
            echo
            echo "### Comment récupérer le lien"
            echo
            echo "**Le plus simple : rejouer ce flux avec « Envoyer le lien par"
            echo "courriel » coché**, et **« destinataire » renseigné avec une"
            echo "VRAIE boîte**. Le lien part là et n'entre dans aucun journal."
            echo
            echo "Sans « destinataire », il part à l'adresse d'« email » — celle"
            echo "qui DÉSIGNE l'identité. Sur la démonstration, ces adresses sont"
            echo "en \`.test\` : réservé par la RFC 2606, il ne résout nulle part,"
            echo "et le message tombe dans le vide sans que rien ne le rattrape."
            echo
            echo "Si les secrets d'envoi ne sont pas déposés, la sortie ci-dessus"
            echo "le dit en nommant ce qui manque — elle ne fait jamais croire"
            echo "qu'un message est parti."
            echo
            echo "À défaut, depuis un poste :"
            echo
            echo "Depuis un poste, avec la chaîne de migration de la base visée."
            echo "La réémission rend un jeton NEUF tant que personne n'a choisi de"
            echo "mot de passe ; elle se ferme pour toujours ensuite (D65)."
            echo
            echo '```bash'
            echo "AMORCAGE_PREMIER_COMPTE_CONFIRME=oui \\"
            echo "DATABASE_URL='<chaîne de migration>' \\"
            echo "pnpm exec tsx scripts/amorcage-premier-compte.mts \\"
            echo "  --reemettre --societe <uuid> --email <courriel> --base <url>"
            echo '```'
            echo
            echo "Ce geste n'écrit son URL dans aucun journal : elle ne vit que dans"
            echo "le terminal qui l'a demandée."
          } >> "$GITHUB_STEP_SUMMARY"
