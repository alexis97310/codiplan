/* ─── Exploitation : tableau de bord, planning, registre, fiche, absences (jetons D124 seulement) ─── */

/* Bande de décomptes : un décompte non nul est une porte, zéro est un état neutre */
.strip{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.strip-i.zero{background:var(--surface-2);border-style:dashed;color:var(--muted)}
.strip-i.zero b{color:var(--muted)}
.strip-i.zero .ico{color:var(--green)}
.card-h .select{height:36px;width:auto;min-width:200px;font-size:var(--fs-sm)}
.td-load{width:170px}
.td-evt .rec{font-size:var(--fs-sm)}
.c4 th,.c4 td{padding:9px 14px}
.c4 td:first-child{white-space:nowrap}
.hbars{display:flex;flex-direction:column;gap:8px}
.hb{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:var(--fs-sm)}
.hb-l{color:var(--gray-ink);font-weight:650}
.hb-t{height:12px;border-radius:999px;background:var(--line-2);overflow:hidden}
.hb-t i{display:block;height:100%;border-radius:999px;background:var(--blue)}
.hb b{min-width:28px;text-align:right}
.kpis{margin-bottom:16px}
a.kpi-mini.link-kpi{display:block;transition:border-color .15s}
a.kpi-mini.link-kpi:hover{border-color:#9db6cf}
a.kpi-mini.link-kpi small{color:var(--blue);font-weight:650}
.kpi-mini b{font-size:22px}

/* Planning : barre d'outils, filtres en listes (D122), encadré, file, grille, frise */
.plan-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:-6px 0 10px}
.plan-filtres{margin-bottom:10px}
.pf{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-sm);font-weight:650;color:var(--gray-ink)}
.pf .select{height:36px;width:auto;min-width:130px;font-size:var(--fs-sm)}
.plan-cal{align-items:center;margin-bottom:14px}
.plan-cal b{display:inline}
.reperes{display:inline-flex;gap:6px;flex-wrap:wrap;margin-left:8px;vertical-align:middle}
.reperes .fchip{height:30px;border-style:solid;background:#fff}
.plan{grid-template-columns:255px minmax(0,1fr)}
.plan.q-folded{grid-template-columns:48px minmax(0,1fr)}
.queue.folded{padding:0;min-height:320px}
.q-unfold{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;padding:12px 0;color:var(--blue);font-weight:750;font-size:var(--fs-sm)}
.q-unfold span{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap}
.queue .card-h{min-height:48px;padding:10px 12px}
.queue .q-tabs{padding:8px 8px 0}
.q-tab{display:inline-flex;align-items:center;gap:6px;height:34px}
.q-tab .count{min-width:20px;height:18px;padding:0 6px;border-radius:999px;background:var(--line-2);color:var(--gray-ink);font-size:12px;font-weight:750;display:inline-grid;place-items:center}
.q-tab .count.hot{background:var(--red-2);color:var(--red-ink)}
.q-search{padding:8px 8px 0}
.q-search .searchbox{max-width:none;flex:0 0 auto}
.q-search .searchbox input{height:36px}
.qcard{position:relative;display:flex;flex-direction:column;gap:2px;cursor:pointer}
.qcard.p2{border-left-color:#efa81c}
.qcard .qc-open{position:absolute;inset:0;border-radius:10px;z-index:0}
.qcard .qc-open:focus-visible{outline-offset:-3px}
.qcard>span{position:relative;z-index:1;pointer-events:none}
.qcard .qc-l1{display:flex;align-items:center;gap:6px}
.qcard .qc-c{flex:1;min-width:0;font-weight:750;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.qcard .qc-d{font-weight:750;font-size:var(--fs-sm);white-space:nowrap}
.qcard .qc-m{font-size:12.5px;color:var(--muted);line-height:1.35}
.qcard .qc-f{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.qcard .qc-f .btn{pointer-events:auto}
.pgrid-hint{display:none;align-items:center;gap:6px;font-size:var(--fs-sm);color:var(--blue-ink);font-weight:650;margin:0 0 6px}
.pgrid-hint.show{display:flex}
.pgrid-wrap{position:relative;border:1px solid var(--line);background:#fff}
.pgrid-wrap.can-scroll{box-shadow:inset -18px 0 14px -14px rgba(20,32,51,.28)}
.pgrid{display:grid;border:0;border-radius:0;width:100%}
.pgrid .pcell{min-width:0}
.pgrid .evt{min-width:0;overflow-wrap:anywhere}
.pcell{min-height:118px}
.pcell.today{background:color-mix(in srgb,var(--blue-2) 40%,#fff)}
.pcell.ph.closed-h{padding:6px 0;display:grid;place-items:center}
.pcell.ph.closed-h span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:12px}
.pcell.tech{display:flex;flex-direction:column;gap:6px}
.tc-load{display:flex;align-items:center;gap:6px}
.tc-load .meter{flex:1}
.pcell .abs-lab{display:flex;align-items:center;gap:4px;margin-bottom:6px;padding:4px 6px;border-radius:6px;background:var(--purple-2)}
.pcell.abs .abs-lab{background:transparent}
.pcell .load{margin-top:auto}
.pcell:not(.ph):not(.tech):not(.closed){display:flex;flex-direction:column;cursor:copy}
.evt{cursor:pointer}
.evt .evt-h{display:flex;align-items:center;gap:4px;font-weight:800;font-variant-numeric:tabular-nums;font-size:12px}
.evt b{font-size:13px;margin:1px 0}
.evt .sent{margin:4px 0 0}
.evt .badge{height:20px;margin-top:4px}
.frise{border:1px solid var(--line);border-radius:var(--radius);background:#fff;overflow:hidden}
.fr-h{display:grid;grid-template-columns:190px minmax(0,1fr);background:var(--surface-2);border-bottom:1px solid var(--line)}
.fr-t{padding:10px 12px;font-weight:800;font-size:var(--fs-sm)}
.fr-axe{position:relative;height:38px}
.fr-axe i{position:absolute;top:11px;transform:translateX(-50%);font-style:normal;font-size:12px;font-weight:750;color:var(--muted)}
.fr-row{display:grid;grid-template-columns:190px minmax(0,1fr);border-bottom:1px solid var(--line-2);min-height:70px}
.fr-tech{display:flex;align-items:center;gap:8px;padding:8px 12px;border-right:1px solid var(--line-2)}
.fr-track{position:relative}
.fr-off{position:absolute;top:0;bottom:0;background:var(--gray-2)}
.fr-abs{position:absolute;top:0;bottom:0;background:var(--purple-2);color:var(--purple);font-style:normal;font-size:12px;font-weight:800;padding:6px 8px;overflow:hidden;white-space:nowrap}
.fr-b.evt{position:absolute;top:10px;bottom:10px;margin:0;overflow:hidden;white-space:nowrap;display:flex;align-items:center;gap:4px;padding:4px 8px}
.fr-b b{overflow:hidden;text-overflow:ellipsis}
.fr-now{position:absolute;top:0;bottom:0;width:2px;background:var(--red)}
.plan-legend i.lg-plan{background:var(--blue-2);box-shadow:inset 3px 0 var(--blue)}
.plan-legend i.lg-cours{background:var(--red-2);box-shadow:inset 3px 0 var(--red)}
.plan-legend i.lg-term{background:var(--green-2);box-shadow:inset 3px 0 var(--green)}
.plan-legend i.lg-abs{background:var(--purple-2)}
.plan-legend i.lg-ferme{background:repeating-linear-gradient(135deg,var(--surface-2) 0 4px,var(--line) 4px 8px)}
.day-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 8px}
.day-nav b{text-align:center}
.m-tech{margin-top:10px}
.m-tech .card-h{min-height:48px;padding:10px 14px}
.m-week{padding:8px 2px;border-bottom:1px solid var(--line-2);font-size:var(--fs-sm);display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.m-file .qcard{width:100%;margin:8px 0}
.agenda-m .select{margin:6px 0 4px}

/* Fenêtre de pose (§3.10 du 27/09) */
.dialog.pose{width:min(880px,calc(100vw - 32px))}
.pose-sum{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);margin-bottom:14px}
.pose-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 20px}
.tech-pick{display:flex;flex-direction:column;gap:6px}
.tp{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;text-align:left}
.tp>span:not(.av){display:flex;flex-direction:column;min-width:0}
.tp:hover:not([disabled]){border-color:var(--blue);background:var(--hover)}
.tp.on{border-color:var(--blue);background:var(--blue-2);box-shadow:inset 0 0 0 1px var(--blue)}
.tp.bloq{opacity:.62;cursor:not-allowed}
.ctl{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 16px}
.ctl li{display:flex;align-items:center;gap:8px;font-size:var(--fs-sm);font-weight:650}
.ctl li.ok{color:var(--green-ink)}
.ctl li.ko{color:var(--red-ink)}
.ctl li.wa{color:var(--orange-ink)}
.tr-line{display:flex;align-items:center;gap:10px;min-height:44px;padding:6px 4px;border-bottom:1px solid var(--line-2)}
.tr-line input{width:18px;height:18px}

/* Registre, à facturer */
.density button[disabled]{opacity:1;cursor:default}
.seg-links{display:inline-flex;padding:3px;background:var(--line-2);border-radius:10px;gap:2px;flex-wrap:wrap}
.seg-links a{height:32px;padding:0 12px;border-radius:8px;font-weight:700;font-size:var(--fs-sm);color:var(--gray-ink);display:inline-flex;align-items:center;gap:6px}
.seg-links a.active{background:#fff;color:var(--blue);box-shadow:0 1px 5px rgba(31,45,65,.12)}
.lcard.sel-card{display:flex;gap:10px;align-items:flex-start}
.lcard.sel-card>a{flex:1;min-width:0;display:block}
.lcard.sel-card .cbx{width:44px;height:44px;margin:-6px 0 0 -8px}

/* Fiche intervention */
.ctl-list .check-row{padding:10px 0}
.ctl-list .check-row:last-child{border-bottom:0}
.check-row .cr-ico.todo{background:var(--red-2);color:var(--red-ink);box-shadow:none}

/* Absences : semaine en calendrier + 4 semaines en bandes */
.abs-week{display:flex;flex-direction:column}
.aw-row{display:grid;grid-template-columns:130px repeat(6,minmax(0,1fr));gap:4px;align-items:center;min-height:40px;border-bottom:1px solid var(--line-2)}
.aw-row:last-child{border-bottom:0}
.aw-head span{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;text-align:center}
.aw-head span.today{color:var(--blue)}
.aw-c{height:32px;border-radius:6px;font-size:12px;font-weight:750;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.05;overflow:hidden;white-space:nowrap;letter-spacing:-.01em}
.aw-c.full{background:var(--purple-2);color:var(--purple)}
.aw-c.part{background:repeating-linear-gradient(135deg,var(--purple-2) 0 5px,#fff 5px 10px);color:var(--purple);box-shadow:inset 0 0 0 1px var(--purple-line)}
.abs-list-m{display:none}

/* Bon */
.doc-signs .doc-sign{min-height:120px}

@media (max-width:1439px){
  .plan{grid-template-columns:230px minmax(0,1fr)}
  /* Semaine des absences : la colonne des noms cède sa place aux cases (libellés entiers jusqu'à 900 px). */
  .aw-row{grid-template-columns:86px repeat(6,minmax(0,1fr))}
  .aw-row .ac-t .av{display:none}
}
@media (max-width:999px){
  /* Trop étroit pour un libellé : une pastille, le détail dans l'infobulle et la liste en dessous. */
  .aw-row{grid-template-columns:78px repeat(6,minmax(0,1fr));gap:2px}
  .aw-c .aw-t{display:none}
  .aw-c.full::after,.aw-c.part::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--purple)}
}
@media (max-width:1023px){
  .plan{grid-template-columns:minmax(0,1fr)}
  .plan .queue{max-height:none}
  .pose-grid{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:899px){
  .plan .queue,.plan-filtres,.plan-bar .seg,.plan-cal .reperes,.pgrid-hint.show,.frise{display:none}
  .plan-bar{margin:0 0 8px}
  .plan-legend{display:none}
  .strip{grid-template-columns:minmax(0,1fr)}
  .td-load{width:96px}
  .hb{grid-template-columns:minmax(90px,120px) minmax(0,1fr) auto}
  .ctl{grid-template-columns:minmax(0,1fr)}
  .aw-row{grid-template-columns:78px repeat(6,minmax(0,1fr));gap:2px}
  .aw-row .ac-t .av{display:none}
  .aw-c .aw-t,.aw-head .aw-n{display:none}
  .aw-c.full::after,.aw-c.part::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--purple)}
  .abs-cal{display:none}
  .abs-list-m{display:block}
  .filterbar .pf{flex:1 1 140px}
  .filterbar .pf .select{flex:1}
  .card-h .select{min-width:0;width:100%}
  .kpis{grid-template-columns:minmax(0,1fr)}
  .c4 th,.c4 td{padding:8px 8px;font-size:var(--fs-sm)}
  .c4 .avc .av{display:none}
  .dialog.pose{width:100%}
  .tr-line{min-height:48px}
}

/* ════════ Pages de l'agent B : clients, sites, parc, VGP, scan (jetons seulement) ════════ */
/* Puce ou segment à zéro : un état neutre, pas une porte (règle « tout chiffre est une porte »). */
.fchip.zero{opacity:.55;cursor:default}
.fchip.zero:hover{border-color:var(--line-strong);color:var(--gray-ink)}
/* Segment fait de liens (réserves VGP) : même dessin que .seg button, adresse partageable. */
.seg-liens a,.seg-liens .seg-zero{height:32px;padding:0 12px;border-radius:8px;font-weight:700;font-size:var(--fs-sm);color:var(--gray-ink);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.seg-liens a:hover{color:var(--ink)}
.seg-liens a.active{background:var(--surface);color:var(--blue);box-shadow:var(--shadow-sm),0 0 0 1px var(--line)}
.seg-liens a.active .pill-count{background:var(--blue-2);color:var(--blue-ink)}
.seg-liens .seg-zero{opacity:.55}
/* Choix indisponible (l'état actuel d'une machine). */
.choice[disabled]{opacity:.55;cursor:not-allowed;background:var(--surface-2)}
/* Titre de ligne cliquable dans une mini-liste qui porte aussi un bouton ; le n° de série ne se coupe pas. */
.mi-link{color:inherit}
.mi-t .mono,.mi-m .mono{white-space:nowrap}
.mi-link:hover{color:var(--blue);text-decoration:underline}
/* Puce de filtre dont la valeur est longue : elle passe à la ligne au lieu de déborder. */
.fchip.fchip-long{white-space:normal;height:auto;min-height:36px;padding-top:6px;padding-bottom:6px;text-align:left;max-width:100%}
/* Liste pleine largeur dans un dialogue ou un volet ; un champ qui la suit garde son écart. */
.dlg-list{margin:6px -20px 0;border-top:1px solid var(--line-2)}
.dlg-list+.field,.dlg-list+p{margin-top:14px}
/* Violet réservé à l'absence : le symbole de la machine dans l'aperçu du parc passe en ton neutre. */
.mprev .mp-sym{background:var(--gray-2);color:var(--gray-ink)}
/* Bouton réservé au téléphone (la règle .btn l'emporterait sur .mob-only). */
.btn.mob-only{display:none}
/* Réserves sur la fiche machine : texte, puis l'état et sa suite, puis le geste. */
.res-item.res-col{display:block}
.res-col .res-suite{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:6px}
.res-col .res-suite .l2{font-size:var(--fs-sm);color:var(--muted)}
.res-col .res-suite .btn{margin-top:2px}
/* Aide « ? » dans un sous-titre de page. */
.page-head .sub .help{vertical-align:middle;margin-left:4px}
/* Scan d'une étiquette. */
.scan-col{max-width:560px;margin:0 auto}
.scan-page .scan-col{width:min(560px,100%)}
.scan-demo{display:flex;align-items:center;justify-content:center;gap:8px 10px;flex-wrap:wrap;margin-bottom:16px}
@media (max-width:899px){
  .mini-item.mi-wrap{flex-wrap:wrap}
  .mi-link{display:flex;align-items:center;min-height:32px}
  .mini-item.mi-wrap .mi-side{flex:1 1 100%;justify-content:flex-start;padding-left:48px}
  .btn.mob-only{display:inline-flex}
  .scan-card{padding:24px 18px}
}
/* Carte client : quatre compteurs alignés en grille (le libellé long passe à la ligne dans sa colonne). */
.ent .e-stats.e-4{display:grid;grid-template-columns:repeat(4,auto);justify-content:space-between;gap:0 12px}
.ent .e-stats.e-4 .ann{grid-column:1/-1}
/* Pied de formulaire au téléphone : les boutons passent à la ligne au lieu de déborder à gauche ;
   « Annuler » en dernier ; le primaire, déjà dans la barre du bas, n'est pas répété. */
@media (max-width:899px){
  .card-f.pied{flex-wrap:wrap}
  .card-f.pied>span[style]{display:none}
  .card-f.pied>.btn{flex:1 1 100%}
  .card-f.pied>.btn.ghost{order:3}
  .has-sticky .card-f.pied-sticky>.btn.primary{display:none}
}
/* Registre VGP groupé par client : l'en-tête de groupe passe à la ligne au téléphone. */
.group-h{flex-wrap:wrap;row-gap:6px}

/* ════════ Paramètres, imports, mon compte, état de l'installation (pages-c.js) ════════
   Jetons de :root seulement (styles.css) et leurs dérivés ; aucune couleur nouvelle. */

/* Espaceur de pied de formulaire : « Annuler » à gauche, le primaire à droite */
.c-sp{flex:1}

/* ─── Hub : carte « Identité de la société », en lecture, en tête ─── */
.idc{margin-bottom:8px}
.idc .card-h h2{flex:1;min-width:0}
.idc-top{display:flex;align-items:center;gap:14px;min-width:0;margin-bottom:6px}
.idc-top .soc-logo{flex:0 0 auto}
.idc-nom{display:flex;flex-direction:column;gap:3px;min-width:0}
.idc-nom b{font-size:var(--fs-xl);line-height:1.25;overflow-wrap:anywhere}
.idc-ment{font-weight:500;color:var(--gray-ink)}
.idc-hint{display:flex;gap:8px;align-items:flex-start;margin-top:12px}
.idc-hint>.ico{margin-top:1px;color:var(--muted)}

/* ─── Hub : une porte par écran ; son état (décompte ou alerte) est un lien à part,
   au-dessus du lien de la carte, qui ouvre la liste exacte qu'il compte ─── */
.hubc-i{position:relative;display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:64px;transition:border-color .15s,box-shadow .15s}
.hubc-i:hover{border-color:var(--blue-line);box-shadow:var(--shadow-sm)}
.hubc-a{display:flex;align-items:center;gap:12px;min-width:0;border-radius:8px}
.hubc-a:after{content:"";position:absolute;inset:0;border-radius:12px}
.hubc-a>.ico{color:var(--muted-2);flex:0 0 auto}
.hubc-i:hover .hubc-a>.ico{color:var(--blue)}
.hubc-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.hubc-t b{font-size:var(--fs-md)}
.hubc-t span{font-size:var(--fs-sm);color:var(--muted);line-height:1.35}
.hubc-s{position:relative;z-index:1;align-self:flex-start;margin-left:48px;display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 11px;border-radius:999px;font-size:var(--fs-sm);font-weight:750;line-height:1.25}
.hubc-s.warn{background:var(--orange-2);color:var(--orange-ink);box-shadow:inset 0 0 0 1px var(--orange-line)}
.hubc-s.neutral{background:var(--surface-2);color:var(--gray-ink);box-shadow:inset 0 0 0 1px var(--line);font-weight:650}
a.hubc-s:hover{text-decoration:underline}
span.hubc-s{pointer-events:none}

/* ─── En-tête d'un bloc de page qui porte un tableau ─── */
.sec-h{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px 12px;margin:24px 0 10px}
.sec-h:first-child{margin-top:0}
.page-head+.sec-h{margin-top:4px}
.sec-h h2{font-size:var(--fs-lg);font-weight:800;display:flex;align-items:center;gap:8px}
.sec-h h2 .ico{color:var(--muted)}

/* ─── Carte d'une ligne au téléphone qui porte des boutons (div, pas un lien) ─── */
.rcard .lc-top{flex-wrap:wrap}
.rcard .lc-foot{justify-content:flex-start;flex-wrap:wrap}
.rcard .lc-foot:empty{display:none}
.c-card-field{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px}

/* ─── Aides sous un tableau ─── */
.c-notes{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.c-notes .hint,.c-side-hint{display:flex;gap:8px;align-items:flex-start}
.c-notes .hint>.ico{margin-top:1px;flex:0 0 auto}
.c-side-hint{padding:10px 18px 12px;margin:0}

/* ─── Tarifs, trajets, équipe ─── */
.table tr.c-sans td{background:color-mix(in srgb,var(--orange-2) 45%,var(--surface))}
.c-min{display:flex;align-items:center;gap:6px}
.c-min .input{width:96px}
.c-tags{display:flex;flex-wrap:wrap;gap:4px}
.late-c{color:var(--red-ink);font-weight:750}
.c-dlg-txt{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.c-dlg-list .mini-item{padding:10px 0}
.hours .bar em.ferme{left:10px;color:var(--muted)}
.c-feries .mini-item{padding:10px 0}

/* ─── Nouvelle agence ─── */
.c-form{max-width:820px}
.c-form>.card-b{padding:20px 22px 6px}

/* ─── Données à compléter : une ligne par point ─── */
.dac-row{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:14px;align-items:start;padding:14px 18px;border-bottom:1px solid var(--line-2)}
.dac-row:last-child{border-bottom:0}
.dac-main{min-width:0}
.dac-t{font-weight:750;display:flex;align-items:center;gap:8px;flex-wrap:wrap;line-height:1.35}
.dac-m{font-size:var(--fs-sm);color:var(--muted);margin-top:2px;line-height:1.4}
.dac-ex{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:6px;font-size:var(--fs-sm);line-height:1.45}
.dac-act{align-self:center}
.dac-act:empty{display:none}

function ic(name, c) { return '<svg class="ico' + (c ? " " + c : "") + '" aria-hidden="true" focusable="false"><use href="#i-' + name + '"/></svg>'; }
function iconSprite() {
  return '<svg xmlns="http://www.w3.org/2000/svg" style="display:none">' + Object.keys(ICONS).map((k) => '<symbol id="i-' + k + '" viewBox="0 0 24 24">' + ICONS[k] + "</symbol>").join("") + "</svg>";
}

/* ─── Composants (chaînes HTML) ───────────────────────────────────── */
function st(s, lg) { return '<span class="badge st-' + s + (lg ? " lg" : "") + '">' + esc(STATUTS[s] || s) + "</span>"; }
function prio(p, full) { return p ? '<span class="prio ' + p.toLowerCase() + '" title="' + esc(PRIOS[p]) + '">' + (full ? esc(PRIOS[p]) : p) + "</span>" : ""; }
function badge(text, tone, dot) { return '<span class="badge ' + (tone ? "t-" + tone : "t-gray") + '">' + (dot ? '<span class="dot"></span>' : "") + esc(text) + "</span>"; }
function tag(text, icon) { return '<span class="tag">' + (icon ? ic(icon, "s") : "") + esc(text) + "</span>"; }
function machineSt(s) { const v = STATUTS_MACHINE[s] || [s, "t-gray"]; return '<span class="badge ' + v[1] + '">' + esc(v[0]) + "</span>"; }
function avatar(t, lg) { if (!t) return '<span class="av none' + (lg ? " lg" : "") + '" title="Aucun technicien">?</span>'; return '<span class="av c' + t.color + (lg ? " lg" : "") + '" title="' + esc(t.nom) + '">' + esc(t.ini) + "</span>"; }
function techCell(t) { return t ? '<span class="avc">' + avatar(t) + esc(t.court) + "</span>" : '<span class="muted">Non affectée</span>'; }
function kbd(k) { return '<span class="kbd">' + esc(k) + "</span>"; }
/* « Valeur à fixer par Alexis » : souligné orange pointillé, info au survol (CLAUDE.md §8). */
function afixer(text, ref) { return '<span class="afixer" title="Valeur à fixer par Alexis' + (ref ? " — " + esc(ref) : "") + '">' + esc(text) + "</span>"; }
/* Annotation (masquée par défaut) : renvoie à l'écart, la question ou la proposition qui justifie l'élément. */
function ann(code) { return '<sup class="ann" title="' + esc(code) + '">' + esc(code) + "</sup>"; }

function btn(label, o = {}) {
  const c = cx("btn", o.kind, o.size, o.icon && !label ? "icon" : "", o.cls);
  const inner = (o.icon ? ic(o.icon) : "") + (label ? "<span>" + esc(label) + "</span>" : "") + (o.chev ? ic("chev-d", "s") : "");
  const a = (o.act ? ' data-act="' + o.act + '"' : "") + (o.arg != null ? ' data-arg="' + esc(o.arg) + '"' : "") + (o.title ? ' title="' + esc(o.title) + '" aria-label="' + esc(o.title) + '"' : "") + (o.disabled ? " disabled" : "") + (o.attrs || "");
  return o.href ? '<a class="' + c + '" href="' + o.href + '"' + a + ">" + inner + "</a>" : '<button type="button" class="' + c + '"' + a + ">" + inner + "</button>";
}
function pageHead(o) {
  return '<header class="page-head"><div class="ph-main">' +
    (o.eyebrow ? '<div class="eyebrow">' + esc(o.eyebrow) + "</div>" : "") +
    "<h1>" + o.title + "</h1>" +
    (o.sub ? '<p class="sub">' + o.sub + "</p>" : "") +
    (o.facts ? '<div class="facts">' + o.facts + "</div>" : "") +

/* ─── Temps : « maintenant » de la maquette, et le créneau d'une intervention ─── */
const QUAND_MAINTENANT = TODAY + " " + hm(NOW);
function quandIv(i) { return i.date ? i.date + " " + hm(i.start != null ? i.start : 0) : null; }
/* « Dernière intervention » = la dernière DATÉE, quel que soit son statut (TP-A1 du 28/09) : la plus récente dont le créneau a commencé. */
function derniereInterventionDatee(list) { return list.filter((i) => i.statut !== "annulee" && quandIv(i) && quandIv(i) <= QUAND_MAINTENANT).sort((a, b) => quandIv(b).localeCompare(quandIv(a)))[0] || null; }
/* « Prochaine intervention » = la première planifiée dont le créneau n'a pas commencé. */
function prochaineInterventionPlanifiee(list) { return list.filter((i) => ["planifiee", "affectee"].includes(i.statut) && quandIv(i) && quandIv(i) > QUAND_MAINTENANT).sort((a, b) => quandIv(a).localeCompare(quandIv(b)))[0] || null; }
/* Ordre de l'historique (TP-A1 du 28/09, fusion CS9, CS29, PV-15) : les ouvertes sans date en tête
   (la plus urgente, puis la plus ancienne), puis la plus récente. Même ordre sur les fiches client, site, machine. */
function ordreHistorique(list) {
  const sansDate = (i) => estOuverte(i) && !i.date;
  const tete = list.filter(sansDate).sort((a, b) => (a.prio || "P9").localeCompare(b.prio || "P9") || (a.cree || "").localeCompare(b.cree || ""));
  return tete.concat(list.filter((i) => !sansDate(i)).sort((a, b) => (quandIv(b) || "").localeCompare(quandIv(a) || "")));
}
/* Ordre du bloc « À traiter » : à planifier (la plus urgente, puis la plus ancienne), en retard, en cours, suspendues,
   terminées à contrôler, puis les planifiées, la plus proche d'abord. */
function ordreATraiter(list) {
  const rang = (i) => (i.statut === "a_planifier" ? 0 : enRetard(i) ? 1 : i.statut === "en_cours" ? 2 : i.statut === "suspendue" ? 3 : i.statut === "terminee" ? 4 : 5);
  return list.slice().sort((a, b) => rang(a) - rang(b) || (rang(a) === 0 ? (a.prio || "P9").localeCompare(b.prio || "P9") || (a.cree || "").localeCompare(b.cree || "") : (quandIv(a) || "").localeCompare(quandIv(b) || "")));
}

/* ════════ PARC MACHINES, VGP, SCAN ════════ */

/* QR de démonstration (motif pseudo-aléatoire, NE SE LIT PAS : aucune adresse réelle encodée). Employé aussi par pages-d.js. */
function qrSvg(seed, size) {
  const n = 25; let x = 0; for (const ch of String(seed)) x = (x * 31 + ch.charCodeAt(0)) >>> 0;
  const rnd = () => ((x = (x * 1103515245 + 12345) >>> 0) / 4294967296);
  const finder = (r, c) => { for (const [fr, fc] of [[0, 0], [0, n - 7], [n - 7, 0]]) { const a = r - fr, b = c - fc; if (a >= 0 && a < 7 && b >= 0 && b < 7) return a === 0 || a === 6 || b === 0 || b === 6 || (a >= 2 && a <= 4 && b >= 2 && b <= 4) ? 1 : 0; if (a >= -1 && a <= 7 && b >= -1 && b <= 7) return 0; } return null; };
  let d = "";
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) { const f = finder(r, c); const on = f === null ? (r === 6 || c === 6 ? (r + c) % 2 === 0 : rnd() > 0.52) : f; if (on) d += "M" + c + " " + r + "h1v1h-1z"; }
  return '<svg viewBox="-2 -2 ' + (n + 4) + " " + (n + 4) + '" width="' + (size || 150) + '" height="' + (size || 150) + '" role="img" aria-label="QR de démonstration (illisible)" shape-rendering="crispEdges"><rect x="-2" y="-2" width="' + (n + 4) + '" height="' + (n + 4) + '" style="fill:var(--surface)"/><path d="' + d + '" style="fill:var(--ink)"/></svg>';
}
/* Étiquette : sous le QR, la désignation et le n° de série (QT-11 a). */
function etiquetteMachine(m, taille) {
  return '<div class="' + cx("label-prev", taille > 130 && "big") + '">' + qrSvg(m ? m.ref : "nouvelle", taille) + "<div><b>" + (m ? esc(fam(m).nom) : "Désignation") + '</b><div class="sm">' + (m ? esc(modele(m).marque + " " + modele(m).ref) : "Marque et modèle") + '</div><div class="mono sm">' + (m ? m.sn : "N° de série") + "</div></div></div>";
}
/* Les quatre gestes tracés sur une machine (QT-12 a : le bureau seulement). */
const GESTES_MACHINE = [["etat", "sliders", "Changer l'état", "En service, en panne, arrêtée"], ["transfert", "swap", "Transférer", "Vers un autre site ou client"], ["remplacer", "refresh", "Remplacer", "Par une machine neuve, historique conservé"], ["sortir", "archive", "Sortir du parc", "Remplacée ou ferraillée"]];

/* ─── Réserves VGP : trois états (QT-9 a) ; l'intervention créée est un lien, pas un état ─── */
const ETATS_RESERVE = { a_traiter: ["À traiter", "orange"], levee: ["Levée", "green"], ecartee: ["Écartée", "gray"] };
function etatReserve(r) { return r.etat === "intervention" ? "a_traiter" : r.etat; }
function reservesATraiter() { return DATA.reserves.filter((r) => etatReserve(r) === "a_traiter"); }
function reservesSansIntervention() { return reservesATraiter().filter((r) => !r.iv); }
function suiteReserveTexte(r) {
  const e = etatReserve(r), i = r.iv ? intv(r.iv) : null, pi = r.parIv ? intv(r.parIv) : null;
  const lien = (x) => '<a class="link nowrap" href="#/interventions/' + x.id + '">' + x.num + "</a>";
  return e === "a_traiter" ? (i ? "intervention " + lien(i) + " · " + esc(STATUTS[i.statut].toLowerCase()) : "depuis " + age(r.verif)) : e === "levee" ? "le " + dmy(r.le) + (pi ? " · par " + lien(pi) : "") : esc(r.motif);
}
function suiteReserve(r) { const e = etatReserve(r); return badge(ETATS_RESERVE[e][0], ETATS_RESERVE[e][1]) + '<div class="l2">' + suiteReserveTexte(r) + "</div>"; }
function gestesReserve(r) {
  if (etatReserve(r) !== "a_traiter" || r.iv || !can("qualifier")) return "";
  return '<div class="row" style="justify-content:flex-end;gap:6px;flex-wrap:nowrap">' + btn("Écarter…", { size: "sm", kind: "ghost", act: "ecarter", arg: r.id }) + btn("Créer l'intervention", { size: "sm", act: "creer-iv-reserve", arg: r.id }) + "</div>";
}

/* ─── Registre VGP : machines du parc, clients actifs (question PV-32), familles soumises ─── */
function registreVgp(o = {}) {
  return DATA.machines.filter((m) => !m.sortie && cli(site(m.site).client).actif && (o.hors || fam(m).vgp === "soumise") && (!o.site || m.site === o.site)).map((m) => ({ m, v: vgpDe(m) }));
}
const FILTRES_VGP = { depassee: ["Dépassées", (v) => v.etat === "depassee"], a_venir: ["À venir", (v) => v.etat === "a_venir"], sans: ["Sans information", (v) => v.etat === "sans"], recue: ["Informations reçues", (v) => !!v.der] };
const RANG_VGP = { depassee: 0, sans: 1, a_venir: 2, plus_tard: 3, a_determiner: 4, hors: 5 };

  /* ═══ Données à compléter : UNE définition des points, pour la page et pour tout décompte qui les annonce ═══

  function pointsDonnees(tous) {

        fausse: "Aucun forfait de déplacement ne s'y applique : le déplacement n'est pas facturé.", ex: (s) => [siteNom(s), "#/sites/" + s.id] },

      { cle: "code", court: "Sans code externe", groupe: "facture", icon: "hash", titre: "Clients sans code externe", liste: DATA.clients.filter((c) => c.actif && !c.code), liens: "#/clients?vue=sans-code",
        fausse: "Sans « " + DATA.societe.codeExterne + " », leurs factures ne se retrouvent pas dans votre logiciel de facturation.", ex: (c) => [c.nom, "#/clients/" + c.id] },
      { cle: "prevenus", court: "Sans courriel", groupe: "courriel", icon: "mail", titre: "Sites dont personne ne sera prévenu", liste: S.filter((s) => { const k = donneurOrdre(s); return !k || !k.email; }), liens: null,
        fausse: "Aucun donneur d'ordre avec un courriel : la planification ne prévient personne.", ex: (s) => { const k = donneurOrdre(s); return [siteNom(s), "#/sites/" + s.id, k ? k.nom + ", donneur d'ordre sans courriel" : "aucun donneur d'ordre"]; } },
      { cle: "regime", court: "Régime à déterminer", groupe: "registre", icon: "layers", titre: "Familles au régime VGP à déterminer", liste: DATA.familles.filter((f) => f.actif && f.vgp === "a_determiner"), liens: "#/vgp/a-determiner",
        fausse: "Leurs machines n'entrent pas au registre VGP.", ex: (f) => [f.nom, null, plur(DATA.machines.filter((m) => !m.sortie && fam(m).id === f.id).length, "machine")] },
      { cle: "rejets", court: "Rejets d'import", groupe: "registre", icon: "upload", titre: "Imports avec des lignes rejetées", liste: lots, liens: "#/imports?vue=rejets",
        fausse: plur(nLignes, "ligne") + (nLignes >= 2 ? " n'ont pas été écrites" : " n'a pas été écrite") + " : à corriger, puis à redéposer.", ex: (l) => ["Lot " + l.id + " · " + l.type, "#/imports/" + l.id, plur(l.rejets, "rejet")] },
      { cle: "serie", court: "Sans n° de série", groupe: "registre", icon: "machine", titre: "Machines sans n° de série", liste: DATA.machines.filter((m) => !m.sortie && !m.sn), liens: null,

  window.pointsDonnees = pointsDonnees;

  /* Décomptes du hub, chacun calculé comme la liste qu'il ouvre. */

  /* ═══ Hub « Paramètres » : la carte d'identité en tête, puis des sections (proposition si PA-08 les retient) ═══ */

  /* Une porte du hub. « etat » : [texte, href, n, ton] — un lien à part, qui ouvre la liste exacte qu'il compte. */

  }

  route("/parametres", () => {
    const g = gardeParametres("Paramètres", [["Paramètres"]]); if (g) return g;

        section("Planification", "Ce qui fait la charge et la durée.", [
          { titre: "Trajets par zone", href: "#/parametres/trajets", icon: "route", tone: "blue", n: DATA.zones.length, desc: "Le trajet aller depuis l'agence, zone par zone", etat: sitesSansTrajet().length ? [plur(sitesSansTrajet().length, "site") + " sans trajet connu", "#/sites?vue=trajet", sitesSansTrajet().length] : [plur(DATA.zones.length, "zone"), null] },

          { titre: "Agences", href: "#/parametres/agences", icon: "building", tone: "blue", n: nAg, desc: "Horaires, jours fériés travaillés et ponts", etat: [plur(nAg, "agence") + (nAg > nAgA ? ", dont " + nAgA + " active" + (nAgA >= 2 ? "s" : "") : ""), null] },
          { titre: "Équipe et accès", href: "#/parametres/equipe", icon: "users", tone: "blue", desc: "Techniciens, comptes de bureau, liens d'accès", etat: ouvrir.length ? [plur(ouvrir.length, "accès") + " à ouvrir", "#/parametres/equipe?acces=a-ouvrir", ouvrir.length] : ["Tous les accès sont ouverts", null] },
          { titre: "Habilitations", href: "#/parametres/habilitations", icon: "badge", tone: "blue", n: DATA.habilitations.length, desc: "Le référentiel, et sa durée de validité", etat: expirees.length ? [plur(expirees.length, "habilitation expirée", "habilitations expirées"), "#/parametres/equipe?echeance=expiree", expirees.length] : null }]) +
        section("Référentiels", "Ce que l'on entretient chez les clients.", [
          { titre: "Référentiel matériel", href: "#/parametres/materiel", icon: "layers", tone: "blue", n: DATA.familles.length, desc: "Familles (avec leur régime VGP) et modèles", etat: aDet.length ? [plur(aDet.length, "famille") + " au régime VGP à déterminer", "#/parametres/materiel?regime=a-determiner", aDet.length] : null }]) +
        section("Données", "Alimenter la base et la fiabiliser.", [

          { titre: "Données à compléter", href: "#/parametres/donnees", icon: "database", tone: "orange", desc: "Ce qui fausse la charge, la facturation ou les courriels", etat: P.length ? [plur(P.length, "point") + " à reprendre", "#/parametres/donnees", P.length] : ["À jour", null] },

  /* ═══ Agences : une liste, une fiche par agence ═══ */
  const JOURS_C = [["lun", "Lun.", "Lundi"], ["mar", "Mar.", "Mardi"], ["mer", "Mer.", "Mercredi"], ["jeu", "Jeu.", "Jeudi"], ["ven", "Ven.", "Vendredi"], ["sam", "Sam.", "Samedi"], ["dim", "Dim.", "Dimanche"]];
  function resumeHoraires(h) {
    const txt = (pl) => (pl && pl.length ? pl.map((x) => hm(x[0]) + "–" + hm(x[1])).join(" · ") : "fermé");
    const G = [];
    JOURS_C.forEach((j, k) => { const t = txt(h[j[0]]); const g = G[G.length - 1]; if (g && g.t === t) g.to = k; else G.push({ from: k, to: k, t }); });
    return G.map((g) => (g.from === g.to ? JOURS_C[g.from][1] : JOURS_C[g.from][1] + "–" + JOURS_C[g.to][1].toLowerCase()) + " " + g.t);
  }
  function joursOuverts(h) {
    const k = JOURS_C.map((j, i) => ((h[j[0]] || []).length ? i : -1)).filter((i) => i >= 0);
    if (!k.length) return "fermée tous les jours";
    const suite = k.every((x, i) => i === 0 || x === k[i - 1] + 1);
    return suite && k.length > 1 ? "du " + JOURS_C[k[0]][2].toLowerCase() + " au " + JOURS_C[k[k.length - 1]][2].toLowerCase() : k.map((i) => JOURS_C[i][2].toLowerCase()).join(", ");
  }
  const etatAgence = (a) => (a.active ? badge("Active", "green") : badge("Inactive", "gray"));

  route("/parametres/agences", () => {

        field("Fuseau horaire", sel([["Pacific/Noumea", "Nouméa (UTC+11)"], ["Pacific/Tahiti", "Tahiti (UTC−10)"], ["Pacific/Wallis", "Wallis (UTC+12)"], ["Europe/Paris", "Paris"]], "Pacific/Noumea"), { opt: true, hint: "Par défaut, celui de la société." }) +

        '</div><div class="card-f desk-only">' + pied + "</div></div>",
      sticky: btn("Annuler", { href: "#/parametres/agences" }) + btn("Créer l'agence", { kind: "primary", act: "demo", arg: "Agence créée. Réglez ses horaires sur sa fiche : sans horaires, elle reste fermée." }),
      notes: ["Territoire et fuseau dans des listes (PA-35) : plus de code ISO ni d'identifiant IANA à taper. Le fuseau reste facultatif (celui de la société, comme dans le produit).", "Horaires : aucun choix fait d'avance (PA-34 : aucune plage préremplie) ; dans le produit, une agence neuve naît fermée tous les jours.", "Créer et modifier une agence : « Administrer les agences » (administrateur) dans la matrice, mais les routes d'aujourd'hui passent par « Paramétrer une société » : question PA-02."] });
  });

  route("/parametres/agences/:id", (p) => {
    const a = agence(p.id);

/* ════════ TERRAIN (téléphone du technicien) · APP TECHNICIEN (rôle de bureau) · ACCÈS · PORTAIL ════════
   Le terrain v1 ne fonctionne qu'en ligne (D121) : la pastille dit l'état du réseau, et sans réseau rien
   n'est enregistré. Aucun montant, aucune position. Une intervention n'y apparaît qu'une fois transmise
   (QG-5 a). Toutes les données viennent de data.js ; les saisies de la démonstration vivent dans S.ui. */

/* ─── Terrain : qui regarde, ce qu'il voit ─────────────────────────── */
const T_DEFAUT = "t1"; // Julien Martin, le technicien de la maquette (ROLES.technicien)
/* Transmises (QG-5 a) : une « Planifiée » est préparée par le bureau et reste invisible du terrain. */
const T_VISIBLES = ["affectee", "en_cours", "suspendue", "terminee", "cloturee"];
/* Motifs de suspension : MOTIFS_SUSPENSION (core.js), la même liste qu'au bureau. Le produit garde un texte
   libre (motif_suspension) ; ces choix le remplissent, « Autre » le fait préciser. Pièce : référence ET date. */

/* ?tech=t3 : la journée d'un autre technicien (Nicolas Petit après son premier accès). */
function tMoi() { const q = S.query || {}; return q.tech && tech(q.tech) ? q.tech : T_DEFAUT; }
function tl(href) { const m = tMoi(); return m === T_DEFAUT ? href : href + (href.includes("?") ? "&" : "?") + "tech=" + m; }
function tVisibles(t) { return DATA.interventions.filter((i) => i.tech === t && T_VISIBLES.includes(i.statut)); }
function tJour(t, d) { return tVisibles(t).filter((i) => i.date === d).sort((a, b) => (a.start || 0) - (b.start || 0)); }
/* RG-DRO-02 amendée par D22, QT-2 (a) : les machines de ses interventions, et le parc des clients qu'il
   visite sous 7 jours — ici, d'après les interventions transmises (question en note de « Mes machines »). */
function tPerimetre(t) {
  const ivs = tVisibles(t).filter((i) => !["terminee", "cloturee"].includes(i.statut) || i.date === TODAY);
  const clients = uniq(ivs.filter((i) => i.date && i.date >= TODAY && i.date <= addD(TODAY, 7)).map((i) => i.client));
  const machinesIv = ivs.flatMap((i) => i.machines);
  return DATA.machines.filter((m) => !m.sortie && (clients.includes(site(m.site).client) || machinesIv.includes(m.id)))
    .sort((a, b) => cli(site(a.site).client).nom.localeCompare(cli(site(b.site).client).nom, "fr", { sensitivity: "base" }) || fam(a).nom.localeCompare(fam(b).nom, "fr", { sensitivity: "base" }));
}
/* Ce que la démonstration vient de faire (« Terminer », « Suspendre ») : gardé dans S.ui, rejouable. */
function tFin(i) { return S.ui["tFin-" + i.id] || null; }
function tPause(i) { return S.ui["tSus-" + i.id] || i.pause; }
function tStatut(i) { return tFin(i) ? "terminee" : S.ui["tSus-" + i.id] ? "suspendue" : i.statut; }
/* Compteur (D120, terrain.compteur.pause) : « Mettre en pause » ferme le segment sans changer le statut ;
   « Reprendre le compteur » en ouvre un nouveau. Le temps affiché ne compte pas les pauses. */
function tPauseC(id) { return S.ui["tPau-" + id] || null; }
function tChronoSec(i) {
  const p = tPauseC(i.id), pauses = (S.ui["tPauTot-" + i.id] || 0) + (p ? Date.now() - p.depuis : 0);
  return Math.max(0, (NOW - i.segs[0][0]) * 60 + Math.floor((Date.now() - T0 - pauses) / 1000));
}
function tChrono(i) { const x = tChronoSec(i); return [Math.floor(x / 3600), Math.floor((x % 3600) / 60), x % 60].map((n) => String(n).padStart(2, "0")).join(":"); }
function tMinute(ms) { return NOW + Math.floor((ms - T0) / 60000); } // heure de la maquette d'un instant de la démonstration
function tChronoHTML(i, cls) { return '<span class="' + (cls || "") + '"' + (tPauseC(i.id) ? "" : ' data-ttimer="' + i.id + '"') + ">" + tChrono(i) + "</span>"; }
setInterval(() => { $$("[data-ttimer]").forEach((el) => { const i = intv(el.dataset.ttimer); if (i) el.textContent = tChrono(i); }); }, 1000);
function tDemoJouee() { return Object.keys(S.ui).some((k) => /^t(Fin|Sus)-/.test(k)); }
function tMachineTxt(i) { return i.machines.length ? fam(mach(i.machines[0])).nom : i.nature === "recensement" ? "Tout le parc du site" : "Sur le site, sans machine"; }
function tLieu(s) { return s.libelle === s.commune ? s.libelle : s.libelle + ", " + s.commune; }
function tContact(s) { return DATA.contacts.find((k) => k.site === s.id) || donneurOrdre(s) || null; }
function tFinTxt(i) {
  const sg = tFin(i) || (i.rapport && i.rapport.signature);
  if (!sg) return "Terminée";
  return sg.absent ? "Client absent : motif tracé, responsable prévenu" : "Signée par " + sg.nom + (sg.fonction ? " (" + sg.fonction + ")" : "");
}
function cap1(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

route("/terrain", () => (S.role === "technicien" ? pJournee() : pAppTechnicien()));

function pJournee() {
  const moi = tMoi(), t = tech(moi);

    '<div class="t-body">' + tNet() +

}

/* ─── Intervention ─────────────────────────────────────────────────── */
function tIv(id) {

}

      tChronoHTML(i, "bt-val") + '<div class="bt-act">' + (pz ? tEcrit("Reprendre le compteur", { size: "lg", icon: "play", act: "t-relance", arg: i.id }) : tEcrit("Mettre en pause", { size: "lg", icon: "pause", act: "t-pause", arg: i.id })) + "</div></div>"
    : fini
    ? '<div class="t-done">' + ic("check-circle", "xl") + "<b>Terminée à " + hm(tFin(i) ? tFin(i).h : i.segs[i.segs.length - 1][1]) + "</b><span>" + esc(tFinTxt(i)) + "</span></div>"
    : sta === "suspendue"
    ? '<div class="t-absent">' + ic("pause") + "<div><b>Suspendue · " + esc(pause.motif) + "</b>" + (pause.piece ? "<p>" + esc(pause.piece) + ", disponible le " + (pause.dispo.includes("-") ? dmy(pause.dispo) : esc(pause.dispo)) + "</p>" : "") + "</div></div>" +
      (S.ui["tSus-" + i.id] ? '<div style="margin-top:10px">' + tEcrit("Reprendre", { kind: "primary", size: "xl", icon: "play", act: "t-reprendre", arg: i.id }) + "</div>" : "")
    : '<div class="t-start">' + tEcrit("Je suis arrivé · démarrer", { kind: "primary", size: "xl", icon: "play", act: "demo", arg: "Compteur démarré à " + hm(Math.max(NOW, i.start - 2)) + "." }) +
      '<div class="t-actions" style="margin-top:10px">' + btn("Itinéraire", { size: "lg", icon: "nav", act: "demo", arg: "L'application de navigation du téléphone s'ouvre vers l'adresse du site." }) + btn("Appeler", { size: "lg", icon: "call", act: "demo", arg: k ? "Appel de " + k.nom + " · " + k.tel : "Aucun contact sur ce site." }) + "</div></div>";
  const hist = m ? ivsDeMachine(m.id).filter((x) => x.id !== i.id && ["terminee", "cloturee"].includes(x.statut)).sort((a, b) => (b.date || "").localeCompare(a.date || "")).slice(0, 3) : [];
  const screen = '<div class="tapp">' + tHead({ back: tl("#/terrain"), sub: (["P1", "P2"].includes(i.prio) ? prio(i.prio) : "") + "<span>" + i.num + " · " + ivCreneauT(i) + "</span>", title: esc(cli(i.client).nom) }) +
    '<div class="t-body">' + tNet() + top +
      (i.panne ? '<div class="t-block"><div class="t-sec">Demande</div><p class="t-panne">' + esc(i.panne) + "</p></div>" : "") +

         : '<div class="t-block"><div class="t-sec">Machine</div><p>' + esc(tMachineTxt(i)) + ".</p></div>") +
      '<div class="t-block"><div class="t-sec">Sur place</div><b>' + esc(s.libelle) + '</b><div class="muted">' + esc(s.adresse || "Adresse non renseignée") + ", " + esc(s.commune) + "</div>" +
        (s.acces ? '<div class="muted">Accès : ' + esc(s.acces) + "</div>" : "") +

      (m ? '<div class="t-block"><div class="t-sec">Dernières interventions sur la machine</div>' + (hist.length ? hist.map((x) => '<div class="t-hist"><b>' + (x.date ? dmy(x.date) : "—") + "</b> · " + esc(NATURES[x.nature]) + (x.rapport && x.rapport.commentaire ? '<div class="muted">' + esc(x.rapport.commentaire) + "</div>" : "") + "</div>").join("") : '<p class="t-vide" style="padding:0">Aucune.</p>') + "</div>" : "") +
    "</div>" +
    (running ? '<div class="t-sticky">' + tEcrit("Suspendre", { size: "lg", icon: "pause", act: "t-suspendre", arg: i.id }) + tEcrit("Terminer", { kind: "primary", size: "lg", icon: "check", href: tl("#/terrain/i/" + i.id + "/rapport") }) + "</div>" : tTabs("journee")) + "</div>";
  return terrainPage(running ? "Intervention en cours" : fini ? "Intervention terminée" : "Intervention à démarrer", screen, {
    pourquoi: "Tout ce qu'il faut sur place : la panne, la machine, l'adresse, le contact à appeler, l'historique (TR-22, CDC §13.3).",
    notes: running
      ? ["La carte porte le compteur et « Mettre en pause » (terrain.compteur.pause, D120) : le temps mesuré se fige, le statut reste « En cours » ; « Reprendre le compteur » ouvre un nouveau segment.", "En bas, « Suspendre » change le statut (motif obligatoire ; pièce : référence ET date) et « Terminer » (QT-4 a) ouvre le rapport, puis la signature : trois étapes, un seul bouton."]

      ? ["Terminée : l'heure de fin et la signature, ou le motif d'absence tracé (QT-5 a). Le bureau valide le rapport, puis clôture (QT-4 a)."]

});
function ivCreneauT(i) {
  if (!i.date) return "Sans date";
  const h = i.start != null ? hm(i.start) + (i.dur ? "–" + hm(i.start + i.dur) : "") : "";
  return i.date === TODAY ? h || "aujourd'hui" : dShort(i.date) + (h ? " · " + h : "");
}

ACT["t-suspendre"] = (el, id) => {
  S.ui.tMotif = null; S.ui.tPiece = ""; S.ui.tDispo = ""; S.ui.tAutre = ""; S.ui.tSusIv = id;

      '<div class="t-choix" role="radiogroup" aria-labelledby="t-mot-l">' + MOTIFS_SUSPENSION.map((x, n) => '<button type="button" class="t-choice" role="radio" aria-checked="false" data-act="t-motif" data-arg="' + x[0] + '"' + (n === 0 ? " data-autofocus" : "") + ">" + x[1] + "</button>").join("") + "</div></div>" +
      '<div data-motif="piece" hidden>' + field("Référence de la pièce attendue", '<input class="input t-in" id="t-piece" data-tkey="tPiece" placeholder="ex. pressostat BV-PS-15">', { req: true, for: "t-piece" }) +
        field("Disponibilité prévue", '<input class="input t-in" id="t-dispo" data-tkey="tDispo" inputmode="numeric" placeholder="jj/mm/aaaa">', { req: true, for: "t-dispo", hint: "La référence et la date vont ensemble : sans date, le bureau ne sait pas quand reprendre." }) + "</div>" +
      '<div data-motif="autre" hidden>' + field("Précisez le motif", '<textarea class="textarea t-ta" id="t-autre" data-tkey="tAutre" rows="3"></textarea>', { req: true, for: "t-autre" }) + "</div>" +
      '<p class="t-etat" id="t-sus-etat">Choisissez un motif.</p>',
    foot: btn("Annuler", { act: "fermer", size: "lg" }) + btn("Suspendre", { kind: "primary", size: "lg", icon: "pause", act: "t-suspendu", disabled: true, attrs: ' id="t-sus-ok"' }) });
};
ACT["t-motif"] = (el, arg) => {
  const d = el.closest(".dialog");
  $$(".t-choice", d).forEach((b) => { b.classList.toggle("on", b === el); b.setAttribute("aria-checked", String(b === el)); });
  $$("[data-motif]", d).forEach((x) => { x.hidden = x.dataset.motif !== arg; });
  S.ui.tMotif = arg; tMaj();
};
ACT["t-suspendu"] = () => {
  const m = MOTIFS_SUSPENSION.find((x) => x[0] === S.ui.tMotif), piece = S.ui.tMotif === "piece";
  const motif = S.ui.tMotif === "autre" ? S.ui.tAutre.trim() : m[1];
  S.ui["tSus-" + S.ui.tSusIv] = { motif, piece: piece ? S.ui.tPiece.trim() : null, dispo: piece ? S.ui.tDispo.trim() : null };
  if (!tPauseC(S.ui.tSusIv)) S.ui["tPau-" + S.ui.tSusIv] = { depuis: Date.now() };
  closeAll(); toast("Intervention suspendue, compteur arrêté. Motif : " + esc(motif) + ".", { icon: "pause" });
  setTimeout(() => go(tl("#/terrain")), 900);
};
ACT["t-reprendre"] = (el, id) => { delete S.ui["tSus-" + id]; render(); toast("Intervention reprise : le compteur reste en pause jusqu'à « Reprendre le compteur ».", { icon: "play" }); };
ACT["t-pause"] = (el, id) => { S.ui["tPau-" + id] = { depuis: Date.now() }; render(); toast("Compteur en pause : l'intervention reste en cours.", { icon: "pause" }); };
ACT["t-relance"] = (el, id) => {
  const p = tPauseC(id);
  if (p) { S.ui["tPauTot-" + id] = (S.ui["tPauTot-" + id] || 0) + (Date.now() - p.depuis); delete S.ui["tPau-" + id]; S.ui["tRep-" + id] = Date.now(); }
  render(); toast("Compteur relancé.", { icon: "play" });
};

/* ─── Rapport ──────────────────────────────────────────────────────── */
function tPrestas(i) { const m = i.machines[0] && mach(i.machines[0]); return DATA.prestations.filter((x) => !x.familles.length || (m && x.familles.includes(fam(m).id))); }

      '<div class="t-block"><label class="t-sec" for="t-com">Commentaire</label><textarea id="t-com" class="textarea t-ta" rows="4" data-tkey="tCom-' + i.id + '" placeholder="Ce qui a été constaté ou fait…">' + esc(S.ui["tCom-" + i.id] || "") + "</textarea>" + btn("Dicter", { icon: "mic", size: "lg", act: "demo", arg: "Dictée : parlez, le texte s'écrit." }) + "</div>" +
      '<div class="t-block"><label class="t-sec" for="t-suite">Suite à donner <span class="t-opt">(facultatif)</span></label><textarea id="t-suite" class="textarea t-ta" rows="3" data-tkey="tSuite-' + i.id + '" placeholder="Ce qu\'il reste à faire ou à surveiller…">' + esc(S.ui["tSuite-" + i.id] || "") + '</textarea><p class="hint">Le bureau la lit sur la fiche et peut en créer une demande.</p></div>' +

});
ACT["t-presta"] = (el, arg) => {
  const [id, pid] = arg.split("|"), k = "tPre-" + id, L = S.ui[k] || [];

  const on = S.ui[k].includes(pid); el.classList.toggle("on", on); el.setAttribute("aria-pressed", String(on));
};
ACT["t-photo"] = (el, id) => {

/* ─── Signature et fin (QT-5 a : signée avec nom et fonction, ou client absent avec motif) ─── */
function tFinOk(id) { return !!((S.ui["tSig-" + id] && (S.ui["tNom-" + id] || "").trim()) || (S.ui["tAbs-" + id] || "").trim()); }
function tFinManque(id) {
  if (tFinOk(id)) return "";
  const nom = (S.ui["tNom-" + id] || "").trim(), sig = S.ui["tSig-" + id];
  return !nom && !sig ? "Pour terminer : le nom du signataire et sa signature, ou « Le client est absent » avec le motif." : !nom ? "Pour terminer : saisissez le nom du signataire." : "Pour terminer : le client signe dans le cadre.";
}
route("/terrain/i/:id/signature", (p) => {

  const recap = [["Temps mesuré", tStatut(i) === "en_cours" ? tChronoHTML(i) : dur(tempsMesure(i))], ["Prestations", prestas.length ? esc(prestas.join(" · ")) : '<span class="muted">Aucune choisie</span>'], ["Commentaire", com ? esc(com) : '<span class="muted">Aucun</span>']].concat(suite ? [["Suite à donner", esc(suite)]] : []);
  const screen = '<div class="tapp">' + tHead({ back: tl("#/terrain/i/" + id + "/rapport"), sub: i.num + " · " + esc(cli(i.client).nom), title: "Signature" }) +
    '<div class="t-body">' + tNet() + stepper([{ label: "Rapport", state: "done" }, { label: "Signature", state: "cur" }, { label: "Terminée", state: "" }]) +
      '<div class="t-block"><div class="t-sec">Ce que le client signe</div><div class="kv one">' + recap.map((x) => "<div><dt>" + x[0] + "</dt><dd>" + x[1] + "</dd></div>").join("") + "</div>" + btn("Modifier le rapport", { size: "lg", icon: "edit", href: tl("#/terrain/i/" + id + "/rapport"), cls: "w100" }) + "</div>" +
      (absent
        ? '<div class="t-block"><div class="t-sec">Signature du client</div><div class="t-absent">' + ic("alert") + "<div><b>Le client est absent</b><p>" + esc(absent) + '</p></div></div><div class="t-2btn">' + btn("Modifier le motif", { size: "lg", act: "t-absent", arg: id }) + btn("Faire signer", { size: "lg", act: "t-present", arg: id }) + "</div></div>"
        : '<div class="t-block"><div class="t-sec">Signataire</div>' +

            field("Nom du signataire", '<input id="t-sign" class="input t-in" data-tkey="tNom-' + id + '" value="' + esc(S.ui["tNom-" + id] || "") + '" autocomplete="off">', { req: true, for: "t-sign" }) +
            field("Fonction", '<input id="t-fn" class="input t-in" data-tkey="tFn-' + id + '" value="' + esc(S.ui["tFn-" + id] || "") + '" placeholder="ex. chef d\'atelier" autocomplete="off">', { opt: true, for: "t-fn", cls: "t-last" }) + "</div>" +
          '<div class="t-block"><div class="t-sec">Signature du client</div>' +
            '<button type="button" class="' + cx("sigpad", signe && "on") + '" id="t-pad" data-act="t-signer" data-arg="' + id + '" aria-label="Cadre de signature du client">' +
              '<span class="sig-ph">Le client signe dans ce cadre</span><svg class="sig-trace" viewBox="0 0 300 120" aria-hidden="true"><path d="M20 84c18-40 30-46 36-22s12 28 24 0 20-34 26-10 10 30 24 6 18-28 32-10 14 16 32-2 20-10 30 6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></button>' +
            '<div class="t-2btn">' + btn("Effacer", { size: "lg", act: "t-effacer", arg: id, disabled: !signe, attrs: ' id="t-eff"' }) + btn("Le client est absent", { size: "lg", act: "t-absent", arg: id }) + "</div></div>") +

  return terrainPage("Signature et fin", screen, {
    pourquoi: "La signature du client avec son nom et sa fonction, ou « client absent » avec un motif tracé et notifié au responsable (QT-5 a, CDC M5).",
    notes: ["Nom et fonction du signataire : champs existants depuis 76-BON-4 (signataire_nom, obligatoire pour une nouvelle signature ; signataire_qualite, facultative).", "« Terminer l'intervention » reste désactivé tant qu'il manque la signature et le nom, ou le motif d'absence ; le message dit quoi faire.", "Terminer arrête le compteur et passe l'intervention en « Terminée » ; le bureau valide le rapport, puis clôture (QT-4 a)."] });
});
ACT["t-signer"] = (el, id) => { S.ui["tSig-" + id] = true; el.classList.add("on"); tMaj(); toast("Signature tracée.", { icon: "pen" }); };
ACT["t-effacer"] = (el, id) => { S.ui["tSig-" + id] = false; const pad = $("#t-pad"); if (pad) pad.classList.remove("on"); tMaj(); };
ACT["t-signataire"] = (el, arg) => {
  const [id, kid] = arg.split("|"), k = DATA.contacts.find((x) => x.id === kid);
  S.ui["tNom-" + id] = k.nom; S.ui["tFn-" + id] = k.fonction;

ACT["t-absent"] = (el, id) => {

    foot: btn("Annuler", { act: "fermer", size: "lg" }) + btn("Enregistrer le motif", { kind: "primary", size: "lg", act: "t-absent-ok", arg: id, disabled: !S.ui.tAbsTxt.trim(), attrs: ' id="t-abs-ok"' }) });

ACT["t-absent-ok"] = (el, id) => { S.ui["tAbs-" + id] = (S.ui.tAbsTxt || "").trim(); S.ui["tSig-" + id] = false; closeAll(); render(); toast("Motif enregistré. Vous pouvez terminer l'intervention.", { icon: "check-circle" }); };
ACT["t-present"] = (el, id) => { S.ui["tAbs-" + id] = ""; render(); };
ACT["t-fin"] = (el, id) => {
  const absent = (S.ui["tAbs-" + id] || "").trim();
  S.ui["tFin-" + id] = absent ? { absent: true, motif: absent, h: NOW + Math.floor((Date.now() - T0) / 60000) } : { nom: (S.ui["tNom-" + id] || "").trim(), fonction: (S.ui["tFn-" + id] || "").trim(), h: NOW + Math.floor((Date.now() - T0) / 60000) };
  delete S.ui["tSus-" + id];
  toast(absent ? "Intervention terminée sans signature : le responsable est prévenu du motif." : "Intervention terminée et signée. Le bureau valide le rapport, puis clôture l'intervention.", { icon: "check-circle" });

/* ─── Fiche machine ────────────────────────────────────────────────── */

/* ─── Mes machines ─────────────────────────────────────────────────── */
function tFiltre(q) {
  const n = norm(q.trim()); let vus = 0;
  $$(".tcard[data-q]").forEach((c) => { const ok = !n || c.dataset.q.includes(n); c.hidden = !ok; if (ok) vus++; });
  const v = $("#t-rech-vide"); if (v) v.hidden = vus > 0;
}
route("/terrain/machines", () => {
  if (S.role !== "technicien") return { redirect: "/terrain" };
  const L = tPerimetre(tMoi()), q = norm((S.ui.tRech || "").trim());
  const cle = (m) => norm([fam(m).nom, modele(m).marque, modele(m).ref, cli(site(m.site).client).nom, site(m.site).libelle, m.sn].join(" "));
  const vus = L.filter((m) => !q || cle(m).includes(q)).length;
  const screen = '<div class="tapp">' + tHead({ sub: "Le parc des clients que vous visitez sous 7 jours", title: "Mes machines" }) +
    '<div class="t-body">' + tNet() +
      '<label class="searchbox t-search">' + ic("search") + '<span class="sr">Rechercher une machine</span><input type="search" class="t-in" data-tkey="tRech" value="' + esc(S.ui.tRech || "") + '" placeholder="N° de série, client, famille…"></label>' +
      '<p class="t-compte">' + plur(L.length, "machine") + "</p>" +
      L.map((m) => '<a class="tcard" data-q="' + esc(cle(m)) + '" href="' + tl("#/terrain/machine/" + m.id) + '"' + (q && !cle(m).includes(q) ? " hidden" : "") + '><div class="tc-top"><span class="tc-t" style="margin:0">' + esc(fam(m).nom) + "</span>" + machineSt(m.statut) + '</div><div class="tc-m">' + esc(cli(site(m.site).client).nom) + " · " + esc(site(m.site).libelle) + '</div><div class="tc-m mono">' + m.sn + "</div></a>").join("") +
      '<p class="t-vide" id="t-rech-vide"' + (vus ? " hidden" : "") + ">Aucune machine ne correspond.</p>" +
      btn("Créer une machine sur place", { size: "lg", icon: "plus", href: tl("#/terrain/machine-express") }) + "</div>" + tTabs("machines") + "</div>";
  return terrainPage("Mes machines", screen, {
    pourquoi: "Ce que RG-DRO-02 (amendée par D22) ouvre au technicien : les machines de ses interventions et le parc des clients qu'il visite dans les 7 jours (QT-2 a).",
    notes: ["Question : une intervention planifiée mais pas encore transmise (invisible du terrain, QG-5 a) ouvre-t-elle déjà le parc de son client ? La maquette répond non.", "Le technicien garde « créer ou modifier une machine » (QT-2 a)."] });
});

/* ─── Machine express (recensement sur place) ──────────────────────── */
function tMxFamilles() {
  const n = (f) => DATA.machines.filter((m) => fam(m).id === f.id).length;
  return DATA.familles.filter((f) => f.actif).sort((a, b) => n(b) - n(a) || a.nom.localeCompare(b.nom, "fr", { sensitivity: "base" })).slice(0, 6);
}
function tMxModeles() {
  const f = S.ui.tMxFam;
  if (!f) return '<p class="t-vide" style="padding:0">Choisissez d\'abord la famille.</p>';
  return '<div class="t-chips">' + DATA.modeles.filter((x) => x.famille === f).map((x) => '<button type="button" class="' + cx("t-chip", S.ui.tMxMod === x.id && "on") + '" aria-pressed="' + (S.ui.tMxMod === x.id) + '" data-act="t-mx-mod" data-arg="' + x.id + '">' + esc(x.marque + " " + x.ref) + "</button>").join("") +
    '<button type="button" class="t-chip" data-act="demo" data-arg="La liste complète des modèles de la famille s\'ouvre, avec la recherche.">Autre modèle…</button></div>';
}
function tMxManque() {
  const u = S.ui, m = [];
  if (!u.tMxFam) m.push("la famille"); if (!u.tMxMod) m.push("le modèle"); if (!(u.tMxSn || "").trim()) m.push("le n° de série");
  return m.length ? "Pour créer : " + m.join(", ") + "." : "";
}

    '<div class="t-body">' + tNet() + '<p class="t-compte">' + (n ? plur(n, "machine créée", "machines créées") + " sur ce site" : "Aucune machine créée ici pour l'instant") + "</p>" +

/* Motif de démonstration (ce n'est pas un vrai code QR) : trois repères et un semis déterministe. */
function dQr(seed, size) {
  let h = 2166136261; for (const c of seed) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; }
  const rnd = () => { h ^= h << 13; h >>>= 0; h ^= h >>> 17; h ^= h << 5; h >>>= 0; return h / 4294967296; };
  const n = 25; let r = "";
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const fx = x < 8 ? x : x >= n - 8 ? x - (n - 7) : -9, fy = y < 8 ? y : y >= n - 8 ? y - (n - 7) : -9;
    const zone = (x < 8 && y < 8) || (x >= n - 8 && y < 8) || (x < 8 && y >= n - 8);
    const on = zone ? fx >= 0 && fx <= 6 && fy >= 0 && fy <= 6 && (fx === 0 || fx === 6 || fy === 0 || fy === 6 || (fx >= 2 && fx <= 4 && fy >= 2 && fy <= 4)) : rnd() > 0.5;
    if (on) r += '<rect x="' + x + '" y="' + y + '" width="1" height="1"/>';
  }
  return '<svg viewBox="0 0 ' + n + " " + n + '" width="' + size + '" height="' + size + '" role="img" aria-label="Code à scanner" shape-rendering="crispEdges" fill="currentColor">' + r + "</svg>";
}
