      {id:"MAC-000992",name:"Station de climatisation R134a",serial:"SC-2022-7712",client:"Nouméa Pneus",site:"Ducos",status:"Arrêtée",tone:"orange",family:"Climatisation",commission:"14/02/2022",agency:"Ducos",contract:"Sans contrat"},

    function head(domain,title,subtitle,actions=""){return `<div class="page-head"><div><div class="eyebrow">${domain}</div><h1>${title}</h1><p>${subtitle}</p></div><div class="actions">${actions}</div></div>`}

    function dashboard(){return head("Exploitation","Tableau de bord","Les décisions et alertes du jour, sans remplacer le planning.",`<button class="btn primary" data-route="/planning">Ouvrir le planning</button>`)+`<div class="grid g4">${kpi("Interventions aujourd’hui","8","6 planifiées · 1 en cours · 1 urgente")}${kpi("Taux d’occupation","78 %","4 techniciens · semaine en cours","green")}${kpi("Dossiers bloqués","3","2 pièces attendues · 1 validation","orange")}${kpi("VGP à prévoir","6","Dans les 30 prochains jours","red")}</div><div class="priority-layout" style="margin-top:16px"><section class="card"><div class="card-head"><h2>Priorités opérationnelles</h2><select class="select" id="priority-filter"><option value="tous">Tous les besoins</option><option value="urgent">Urgences</option><option value="piece">Pièces</option><option value="planning">À planifier</option></select></div><div class="priority-list" id="priority-list">${priorityItems()}</div></section><section class="card"><div class="card-head"><h2>Activité récente</h2><span class="tiny muted">Aujourd’hui</span></div><div class="activity"><span class="activity-time">10:42</span><p><b>INT-2026-00318</b><br><span class="muted tiny">Compteur démarré par J. Lefèvre</span></p></div><div class="activity"><span class="activity-time">09:18</span><p><b>MAC-001104</b><br><span class="muted tiny">Machine déclarée en panne</span></p></div><div class="activity"><span class="activity-time">08:36</span><p><b>INT-2026-00316</b><br><span class="muted tiny">Créneau confirmé par le client</span></p></div><div class="activity"><span class="activity-time">08:05</span><p><b>Import parc</b><br><span class="muted tiny">42 lignes contrôlées, aucune erreur</span></p></div></section></div>`}
    function priorityItems(){const all=[{type:"urgent",rank:"P1",title:"Compresseur arrêté — Lagon Maintenance",meta:"Païta · réponse attendue avant 12:00",route:"/parc/MAC-001104"},{type:"piece",rank:"47j",title:"Pièce attendue — Nouméa Pneus",meta:"Compresseur clim R134a · commande du 02/07",route:"/interventions"},{type:"planning",rank:"03",title:"Trois visites VGP à planifier",meta:"Échéance sous 15 jours · agence de Ducos",route:"/vgp"},{type:"planning",rank:"01",title:"Intervention sans technicien",meta:"INT-2026-00321 · vendredi 13:30",route:"/planning"}];return all.filter(x=>state.priorityFilter==="tous"||x.type===state.priorityFilter).map(x=>`<article class="priority-item"><div class="priority-rank">${x.rank}</div><div><h3>${x.title}</h3><p>${x.meta}</p></div><button class="btn small" data-route="${x.route}">Ouvrir</button></article>`).join("")||`<div class="empty"><b>Aucune priorité dans ce filtre</b><span>Essayez un autre besoin.</span></div>`}
    function planning(){const day=state.planningView==="day";return head("Exploitation","Planning des techniciens","Tous les techniciens actifs restent visibles, y compris sans intervention.",`<div class="seg"><button data-plan-view="week" class="${day?"":"active"}">Semaine</button><button data-plan-view="day" class="${day?"active":""}">Mercredi</button></div><button class="btn primary" data-action="new-job">+ Intervention</button>`)+`<div class="notice"><b>i</b><div><strong>Calendriers d’agence respectés</strong><p>Ducos ouvre du lundi au samedi ; Koné du lundi au vendredi. Une case vide n’est pas automatiquement une disponibilité.</p></div></div><div class="planning-shell"><section class="card"><div class="card-head"><h2>À affecter</h2>${badge("4 dossiers","orange")}</div><div class="queue"><div class="queue-card" data-job="INT-2026-00321"><h4>P1 · Atelier du Port</h4><p>Compresseur arrêté · aujourd’hui</p></div><div class="queue-card" data-job="INT-2026-00322"><h4>Garage de Magenta</h4><p>Entretien pont · 2 h</p></div><div class="queue-card" data-job="INT-2026-00323"><h4>Pacifique Pneus</h4><p>Diagnostic démonte-pneu</p></div><div class="queue-card" data-job="INT-2026-00324"><h4>Mine du Nord</h4><p>Contrôle annuel · Koné</p></div></div></section><section class="card table-wrap">${day?dayPlan():weekPlan()}</section></div>`}

    function machinePage(){const id=state.route.split("/").pop(),m=machines.find(x=>x.id===id)||machines[0];return head("Clients & parc","Fiche machine",`${m.client} · ${m.site}`,`<button class="btn" data-route="/parc">← Retour au parc</button><button class="btn primary" data-action="fake-save">Modifier</button>`)+`<div class="machine-page"><div class="grid"><section class="card machine-banner"><div class="machine-symbol">M</div><div style="flex:1"><div class="mono muted">${m.id}</div><h2 style="margin:3px 0 7px;font-size:22px">${m.name}</h2><div class="actions">${badge(m.status,m.tone)}${badge(m.family,"blue")}</div></div></section>${m.status!=="En service"?`<div class="alert-strip"><span class="alert-num">!</span><div><b>${m.status}</b><div class="tiny">Une intervention curative est ouverte et apparaît dans les priorités.</div></div><button class="btn small" data-route="/interventions">Voir l’intervention</button></div>`:""}<section class="card"><div class="card-head"><h2>Identité et rattachement</h2></div><div class="detail-body"><dl class="kv"><div><dt>Identifiant</dt><dd>${m.id}</dd></div><div><dt>N° de série</dt><dd>${m.serial}</dd></div><div><dt>Client</dt><dd>${m.client}</dd></div><div><dt>Site client</dt><dd>${m.site}</dd></div><div><dt>Agence CODIMA</dt><dd>${m.agency}</dd></div><div><dt>Mise en service</dt><dd>${m.commission}</dd></div><div><dt>Contrat</dt><dd>${m.contract}</dd></div><div><dt>Prochaine VGP</dt><dd>18 novembre 2026</dd></div></dl></div></section><section class="card"><div class="card-head"><h2>Historique des interventions</h2><button class="btn small" data-action="new-job">+ Intervention</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Intervention</th><th>Type</th><th>Technicien</th><th>Résultat</th></tr></thead><tbody><tr><td>12/09/2026</td><td class="mono">INT-2026-00298</td><td>Préventif</td><td>J. Lefèvre</td><td>${badge("Terminée","green")}</td></tr><tr><td>21/06/2026</td><td class="mono">INT-202 871">Voir la machine</button></div><div class="sync ${state.techOffline?"offline":""}">${state.techOffline?"● Enregistré sur cet appareil · en attente d’envoi":"✓ Synchronisé à 12:47"}</div></div></div></div>`}

    function openDrawer(id){const j=jobs.find(x=>x.id===id)||{id,client:"Atelier du Port",machine:"Compresseur atelier",type:"Curatif",status:"À affecter",tone:"orange",tech:"Non affecté",time:"À planifier"};const d=document.getElementById("drawer");d.innerHTML=`<button class="drawer-close" data-action="close-drawer" aria-label="Fermer">×</button><div class="eyebrow">Intervention</div><h2>${j.id}</h2>${badge(j.status,j.tone)}<div class="drawer-grid"><div class="info"><small>Client</small><b>${j.client}</b></div><div class="info"><small>Créneau</small><b>${j.time}</b></div><div class="info"><small>Machine</small><b>${j.machine}</b></div><div class="info"><small>Technicien</small><b>${j.tech}</b></div></div><div class="notice warning"><b>!</b><div><strong>Déplacement contrôlé</strong><p>Les conflits de calendrier et d’agence sont vérifiés avant confirmation.</p></div></div><div class="feedback-demo"><h3>Tester les retours d’enregistrement</h3><p class="muted tiny">Simulation locale : aucune donnée n’est envoyée.</p><div class="actions"><button class="btn small" data-save-state="success">Confirmer</button><button class="btn small" data-save-state="refuse">Simuler un refus</button><button class="btn small" data-save-state="offline">Couper la connexion</button></div><div class="state-line" id="save-state">Aucune modification en cours</div></div>`;d.classList.add("open")}

      "MAC-000871":["111111100010101111111","100000100000101000001","101110101010001011101","101110100000101011101","101110100100101011101","100000100111001000001","111111101010101111111","000000001011000000000","111011111010111000100","101110001011011010010","000001110101111010111","011001011001001111101","101101100110111011001","000000001000101000011","111111101101001101000","100000101111101011000","101110101111111101100","101110100110000100110","101110101100101100001","100000101101010111111","111111101010101100101"],

    };const id=state.route.split("/").pop(),rows=matrices[id]||matrices["MAC-000871"],ctx=c.getContext("2d"),quiet=4,n=rows.length+quiet*2,unit=c.width/n;ctx.fillStyle="#fff";ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle="#07111f";rows.forEach((r,y)=>[...r].forEach((v,x)=>{if(v==="1")ctx.fillRect(Math.round((x+quiet)*unit),Math.round((y+quiet)*unit),Math.ceil(unit),Math.ceil(unit))}))}
    function formatTime(s){const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;return [h,m,sec].map(x=>String(x).padStart(2,"0")).join(":")}

    document.addEventListener("click",e=>{const route=e.target.closest("[data-route]");if(route){navigate(route.dataset.route);return}const job=e.target.closest("[data-job]");if(job){openDrawer(job.dataset.job);return}const machine=e.target.closest("[data-machine]");if(machine){state.selectedMachine=machine.dataset.machine;render();return}const pv=e.target.closest("[data-plan-view]");if(pv){state.planningView=pv.dataset.planView;render();return}const off=e.target.closest("[data-tech-offline]");if(off){state.techOffline=off.dataset.techOffline==="true";render();return}const save=e.target.closest("[data-save-state]");if(save){setSaveState(save.dataset.saveState);return}const a=e.target.closest("[data-action]");if(!a)return;switch(a.dataset.action){case"close-drawer":document.getElementById("drawer").classList.remove("open");break;case"reset-machines":state.machineQuery="";state.machineStatus="tous";render();break;case"copy-id":navigator.clipboard?.writeText(state.route.split("/").pop());toast("Identifiant copié");break;case"print-qr":document.body.classList.add("print-qr");window.print();setTimeout(()=>document.body.classList.remove("print-qr"),200);break;case"timer":state.timerRunning=!state.timerRunning;render();break;case"fake-upload":toast("Fichier de démonstration sélectionné — aucune donnée envoyée");break;case"scan":toast("Simulation : le lecteur QR ouvrirait directement la fiche machine");break;case"new-job":toast("Formulaire d’intervention — maquette locale");break;case"fake-save":toast("Action simulée — aucune donnée réelle modifiée");break;case"notify":toast("2 dossiers demandent votre attention");break}});
